  "Shared path friction":["path","pedestrian","right of way","cyclist","walkway"],
  "Thermal comfort":["heat","shade","thermal","cooling","sheltered","greenery","trees"],

  "Social connection":["lonel","isolation","social bond","companionship","social connection","social engagement","sociability","intergenerational"],
  "Data & privacy":["sensor","data","privacy","monitor","surveillance","camera"],
  "First-last mile mobility":["first-last mile","transport","on-demand","trip","mobility","feeder","ride-hail","av","avs"],
  "Logistics footprint":["delivery","deliveries","micro-hub","logistics","drone","charging","kerb loading"],
  "Reclamation supply":["reclamation","reclaimed","sand","fill"],
  "Coastal & flood resilience":["flood","sea level","coastal","drainage","marine","water"],
  "Heritage & identity":["heritage","culture","identity","belonging","conservation"],
  "Equity & exclusion":["exclusion","equity","low-income","segregation","excluded","uneven","without"],
  "Housing cost":["cost","retrofit","affordab","per housing unit","per hectare"],
  "Regulation & governance":["rules","regulation","enforcement","governance","licensing","codes","standards"],
  "Ecology & greenery":["biodiversity","habitat","ecolog","green space","greenery","trees"],
  "Kerb & pick-up space":["kerb","pick-up","pudo"],
  "Robotics adoption":["robot","robotics"]
};
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const THEME_RX = Object.fromEntries(Object.entries(THEMES).map(([k,ws])=>[k,new RegExp("\\b("+ws.map(esc).join("|")+")","i")]));
function tagThemes(text){ return Object.keys(THEME_RX).filter(k=>THEME_RX[k].test(text)); }
function frictionHits(text){ const t=text.toLowerCase(); return FRICTION.filter(f=>t.includes(f)); }

function score(drivers){
  const nodesBy = drivers.map(d=>{
    const nodes=[]; d.w.forEach(([f,kids],fi)=>{ nodes.push({text:f,order:1,fi}); kids.forEach((k,ki)=>nodes.push({text:k,order:2,fi,ki})); });
    nodes.forEach(n=>n.themes=tagThemes(n.text)); return nodes; });
  const out = drivers.map((d,i)=>{
    const second = nodesBy[i].filter(n=>n.order===2).map(n=>n.text).join(" | ");
    const hits = frictionHits(second);
    const uplift = hits.length===0?0:hits.length===1?0.5:hits.length===2?0.75:1.0;
    const M = MATURITY_SCALE[d.maturity];
    const D = uplift*5; // uplift +0.5..+1.0 scaled onto the 5-point rating range
    const uRaw = 0.6*M + 0.4*D;
    let iRaw=0; const links={};
    // node -> wheel convergence: each node scores 1 for every OTHER wheel holding a node with a shared theme
    nodesBy[i].forEach(n=>{ n.matches=[]; if(!n.themes.length) return;
      nodesBy.forEach((other,j)=>{ if(j===i) return;
        if(other.some(m=>m.themes.some(t=>n.themes.includes(t)))){ iRaw++; n.matches.push(drivers[j].id); links[drivers[j].id]=(links[drivers[j].id]||0)+1; } }); });
    const themeSet=[...new Set(nodesBy[i].flatMap(n=>n.themes))];
    return {id:d.id,M,hits,uplift,D,uRaw,iRaw,links,themeSet,nodes:nodesBy[i]};
  });
  const norm=(vals)=>{const lo=Math.min(...vals),hi=Math.max(...vals);return vals.map(v=>hi===lo?3:1+4*(v-lo)/(hi-lo));};
  const un=norm(out.map(o=>o.uRaw)), im=norm(out.map(o=>o.iRaw));
  out.forEach((o,k)=>{o.U=un[k];o.I=im[k];o.quadrant=quad(o.I,o.U);});
  return out;
}
function quad(I,U){ if(I>=3&&U>=3) return "critical"; if(I>=3) return "megatrend"; if(U>=3) return "wildcard"; return "background"; }
if (typeof module!=="undefined") module.exports={DRIVERS,score};

</script>
<script>
const {useState,useMemo,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const L=window.LucideReact||{};
const Icon=({name,size=16,className=""})=>{const C=L[name];return C?React.createElement(C,{size,className,"aria-hidden":true,strokeWidth:1.8}):null;};

const DOMAINS=[["Social","--d-soc"],["Technological","--d-tech"],["Economic","--d-eco"],["Environmental","--d-env"],["Political","--d-pol"],["Legislative","--d-leg"]];
const DCOL=Object.fromEntries(DOMAINS.map(([d,v])=>[d,`var(${v})`]));
const MATS=["Happening Now","Emerging","Weak Signal","Black Jellyfish","Black Swan","Unconfirmed"];
const Q={
 critical:{name:"Critical Policy Uncertainties",short:"Critical uncertainty",col:"var(--q-crit)",tint:"var(--q-crit-t)",hint:"High impact · High uncertainty",icon:"AlertTriangle"},
 megatrend:{name:"Megatrends",short:"Megatrend",col:"var(--q-mega)",tint:"var(--q-mega-t)",hint:"High impact · Low uncertainty",icon:"TrendingUp"},
 wildcard:{name:"Secondary Risks / Wildcards",short:"Wildcard",col:"var(--q-wild)",tint:"var(--q-wild-t)",hint:"Moderate impact · High uncertainty",icon:"Zap"},
 background:{name:"Background Trends",short:"Background",col:"var(--q-back)",tint:"var(--q-back-t)",hint:"Lower impact · Lower uncertainty",icon:"Waves"}
};
const clone=o=>JSON.parse(JSON.stringify(o));
const STORE="sg2050-foresight-edits-v1";
const loadEdits=()=>{try{const r=localStorage.getItem(STORE);return r?JSON.parse(r):null}catch(e){return null}};
const saveEdits=v=>{try{localStorage.setItem(STORE,JSON.stringify(v))}catch(e){}};
const NUM=Object.fromEntries(DRIVERS.map((d,i)=>[d.id,i+1]));

function wrap(t,max){const w=t.split(/\s+/);const out=[];let cur="";w.forEach(x=>{if((cur+" "+x).trim().length>max&&cur){out.push(cur);cur=x}else cur=(cur+" "+x).trim()});if(cur)out.push(cur);return out;}
function hl(text){ // highlight friction words
  const rx=new RegExp("("+FRICTION.map(f=>f.replace(/[-]/g,"\\-")).join("|")+")","ig");
  return text.split(rx).map((p,i)=>i%2?html`<mark key=${i} style=${{background:"var(--q-crit-t)",color:"var(--fric)",fontWeight:600,padding:"0 2px",borderRadius:3}}>${p}</mark>`:p);
}

/* ---------- Overview ---------- */
function Overview({drivers,scores}){
  const dc=DOMAINS.map(([d])=>[d,drivers.filter(x=>x.domain===d).length]);
  const mc=MATS.map(m=>[m,drivers.filter(x=>x.maturity===m).length]);
  const qc=Object.keys(Q).map(k=>[k,scores.filter(s=>s.quadrant===k).length]);
  return html`<section class="panel p-4 md:p-5 grid gap-5" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))"}}>
    <div class="flex items-center gap-4">
      <div class="mono" style=${{fontSize:44,lineHeight:1,fontWeight:500,color:"var(--accent)"}}>${drivers.length}</div>
      <div><div class="eyebrow">Signals scanned</div><div class="text-sm text-muted">from 25 weak signals.xlsx · 6 scanners</div></div>
    </div>
    <div class="min-w-0"><div class="eyebrow mb-2">Domain (STEEP+L)</div>
      <div class="flex h-2.5 rounded-full overflow-hidden mb-2" style=${{background:"var(--sunk)"}}>${dc.map(([d,n])=>n?html`<div key=${d} title=${d+": "+n} style=${{width:(n/drivers.length*100)+"%",background:DCOL[d]}}></div>`:null)}</div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs">${dc.map(([d,n])=>html`<span key=${d} class="inline-flex items-center gap-1.5"><span style=${{width:8,height:8,borderRadius:2,background:DCOL[d]}}></span>${d}<span class="mono text-muted">${n}</span></span>`)}</div>
    </div>
    <div class="min-w-0"><div class="eyebrow mb-2">Signal maturity</div>
      <div class="grid grid-cols-3 gap-x-3 gap-y-1 text-xs">${mc.map(([m,n])=>html`<div key=${m} class="flex justify-between gap-2"><span class="truncate">${m}</span><span class="mono text-muted">${n}</span></div>`)}</div>
    </div>
    <div class="min-w-0"><div class="eyebrow mb-2">Matrix placement</div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs">${qc.map(([k,n])=>html`<div key=${k} class="flex items-center justify-between gap-2"><span class="inline-flex items-center gap-1.5" style=${{color:Q[k].col}}><${Icon} name=${Q[k].icon} size=${13}/>${Q[k].short}</span><span class="mono">${n}</span></div>`)}</div>
    </div>
  </section>`;
}

/* ---------- Matrix ---------- */
function Matrix({drivers,scores,sel,setSel,moved}){
  const [hover,setHover]=useState(null);
  const W=600,H=520,x0=56,x1=584,y0=16,y1=468;
  const sx=v=>x0+(v-1)/4*(x1-x0), sy=v=>y1-(v-1)/4*(y1-y0);
  const mx=sx(3),my=sy(3);
  const byId=Object.fromEntries(scores.map(s=>[s.id,s]));
  const hv=hover&&byId[hover], hd=hover&&drivers.find(d=>d.id===hover);
  const ql=[["wildcard",x0+10,y0+20,"start"],["critical",x1-10,y0+20,"end"],["background",x0+10,y1-12,"start"],["megatrend",x1-10,y1-12,"end"]];
  return html`<div class="relative">
   <div style=${{overflowX:"auto"}}>
    <svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",minWidth:340,display:"block"}} role="img" aria-label="Foresight matrix: importance against uncertainty">
      <rect x=${mx} y=${y0} width=${x1-mx} height=${my-y0} fill="var(--q-crit-t)"/>
      <rect x=${x0} y=${y0} width=${mx-x0} height=${my-y0} fill="var(--q-wild-t)"/>
      <rect x=${mx} y=${my} width=${x1-mx} height=${y1-my} fill="var(--q-mega-t)"/>
      <rect x=${x0} y=${my} width=${mx-x0} height=${y1-my} fill="var(--q-back-t)"/>
      ${[1,2,3,4,5].map(v=>html`<g key=${v}>
        <line x1=${sx(v)} x2=${sx(v)} y1=${y0} y2=${y1} stroke="var(--line)" stroke-dasharray=${v===3?"":"2 4"}/>
        <line x1=${x0} x2=${x1} y1=${sy(v)} y2=${sy(v)} stroke="var(--line)" stroke-dasharray=${v===3?"":"2 4"}/>
        <text x=${sx(v)} y=${y1+16} text-anchor="middle" fill="var(--muted)" font-size="11" class="mono">${v.toFixed(1)}</text>
        <text x=${x0-8} y=${sy(v)+4} text-anchor="end" fill="var(--muted)" font-size="11" class="mono">${v.toFixed(1)}</text></g>`)}
      <line x1=${mx} x2=${mx} y1=${y0} y2=${y1} stroke="var(--muted)" stroke-width="1.2"/>
      <line x1=${x0} x2=${x1} y1=${my} y2=${my} stroke="var(--muted)" stroke-width="1.2"/>
      ${ql.map(([k,x,y,a])=>html`<g key=${k}><text x=${x} y=${y} text-anchor=${a} fill=${Q[k].col} font-size="12.5" font-weight="700" style=${{fontFamily:"var(--f-display)"}}>${Q[k].name}</text>
        <text x=${x} y=${y+(y<100?15:-15)} text-anchor=${a} fill="var(--muted)" font-size="10.5" class="mono">${Q[k].hint}</text></g>`)}
      <text x=${(x0+x1)/2} y=${H-14} text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="600">Importance (network convergence) →</text>
      <text transform=${`translate(16 ${(y0+y1)/2}) rotate(-90)`} text-anchor="middle" fill="var(--ink)" font-size="12" font-weight="600">Uncertainty →</text>
      ${scores.map(s=>{const d=drivers.find(x=>x.id===s.id);const on=s.id===sel;const r=on?13:10;return html`<g key=${s.id} class="dot" style=${{transform:`translate(${sx(s.I)}px,${sy(s.U)}px)`,cursor:"pointer"}}
          onClick=${()=>setSel(s.id)} onMouseEnter=${()=>setHover(s.id)} onMouseLeave=${()=>setHover(null)}
          tabindex="0" role="button" aria-label=${d.title} onKeyDown=${e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setSel(s.id)}}}>
          ${on?html`<circle r="19" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/>`:null}
          ${moved===s.id?html`<circle r="24" fill="none" stroke="var(--accent)" stroke-width="2" opacity=".7"/>`:null}
          <circle r=${r} fill=${DCOL[d.domain]} stroke="var(--surface)" stroke-width="2"/>
          <text y="3.8" text-anchor="middle" font-size=${on?11:10} font-weight="600" fill="#fff" class="mono" style=${{pointerEvents:"none"}}>${NUM[s.id]}</text>
        </g>`;})}
    </svg>
   </div>
    ${hv?html`<div class="panel absolute pointer-events-none p-2.5 text-xs shadow-lg" style=${{left:12,bottom:56,maxWidth:280}}>
      <div class="font-semibold text-sm mb-1">${NUM[hv.id]}. ${hd.title}</div>
      <div class="mono text-muted">I ${hv.I.toFixed(2)} · U ${hv.U.toFixed(2)} · <span style=${{color:Q[hv.quadrant].col}}>${Q[hv.quadrant].short}</span></div></div>`:null}
  </div>`;
}

/* ---------- Futures Wheel ---------- */
function Wheel({d,s,focus,setFocus}){
  const W=720,H=660,cx=360,cy=330,r1=148,r2=250;
  const ang=[-90,30,150];
  const n2=(fi,ki)=>s.nodes.find(n=>n.order===2&&n.fi===fi&&n.ki===ki);
  const n1=fi=>s.nodes.find(n=>n.order===1&&n.fi===fi);
  const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];
  const col=DCOL[d.domain];
  const Box=({x,y,w,h,text,order,keyid,node})=>{
    const lines=wrap(text,order===1?19:20);const fs=order===1?13.5:12.5;const lh=fs*1.22;
    const fr=order===2&&frictionHits(text).length>0;const on=focus===keyid;
    return html`<g style=${{cursor:"pointer"}} onClick=${()=>setFocus(keyid)} tabindex="0" role="button" aria-label=${"Edit node: "+text}
      onKeyDown=${e=>{if(e.key==="Enter"){setFocus(keyid)}}}>
      <rect x=${x-w/2} y=${y-h/2} width=${w} height=${h} rx=${order===1?10:8}
        fill=${order===1?"var(--surface)":"var(--bg)"} stroke=${on?"var(--ink)":fr?"var(--fric)":order===1?col:"var(--line)"}
        stroke-width=${on?2.2:order===1?1.8:1.2} stroke-dasharray=${fr&&!on?"4 3":""}/>
      ${lines.map((l,i)=>html`<text key=${i} x=${x} y=${y-(lines.length-1)*lh/2+i*lh+fs*.35} text-anchor="middle" font-size=${fs} font-weight=${order===1?600:400} fill="var(--ink)">${l}</text>`)}
      ${node&&node.matches&&node.matches.length?html`<g transform=${`translate(${x+w/2-4} ${y-h/2+4})`}><circle r="10" fill=${col}/><text y="3.5" text-anchor="middle" font-size="10" fill="#fff" class="mono" font-weight="600">${node.matches.length}</text></g>`:null}
    </g>`;
  };
  return html`<div style=${{overflowX:"auto"}}><svg viewBox=${`0 0 ${W} ${H}`} style=${{width:"100%",minWidth:360,display:"block"}} role="img" aria-label=${"Futures wheel for "+d.title}>
    <circle cx=${cx} cy=${cy} r=${r1} fill="none" stroke="var(--line)" stroke-dasharray="2 5"/>
    <circle cx=${cx} cy=${cy} r=${r2} fill="none" stroke="var(--line)" stroke-dasharray="2 5"/>
    ${ang.map((a,fi)=>{const [x,y]=P(a,r1);return html`<g key=${"sp"+fi}>
      <line x1=${cx} y1=${cy} x2=${x} y2=${y} stroke=${col} stroke-width="2" opacity=".55"/>
      ${[-33,33].map((o,ki)=>{const [x2,y2]=P(a+o,r2);return html`<line key=${ki} x1=${x} y1=${y} x2=${x2} y2=${y2} stroke="var(--muted)" stroke-width="1" opacity=".6"/>`;})}</g>`;})}
    ${ang.map((a,fi)=>[-33,33].map((o,ki)=>{const [x,y]=P(a+o,r2);const n=n2(fi,ki);return html`<${Box} key=${"b"+fi+ki} x=${x} y=${y} w=${150} h=${60} text=${n.text} order=${2} keyid=${fi+"-"+ki} node=${n}/>`;}))}
    ${ang.map((a,fi)=>{const [x,y]=P(a,r1);const n=n1(fi);return html`<${Box} key=${"a"+fi} x=${x} y=${y} w=${164} h=${66} text=${n.text} order=${1} keyid=${String(fi)} node=${n}/>`;})}
    <circle cx=${cx} cy=${cy} r="78" fill=${col}/>
    ${wrap(d.title,17).slice(0,5).map((l,i,a)=>html`<text key=${i} x=${cx} y=${cy-(a.length-1)*8+i*16+4} text-anchor="middle" font-size="13" font-weight="700" fill="#fff" style=${{fontFamily:"var(--f-display)"}}>${l}</text>`)}
    <text x="12" y=${H-12} font-size="11" fill="var(--muted)" class="mono">Inner ring: 1st order · Outer ring: 2nd order · Badge: wheels this node converges with · Dashed red: policy trade-off</text>
  </svg></div>`;
}

/* ---------- Refinement bench ---------- */
function Refine({d,s,base,onMat,onText,focus,setFocus,onReset,edited}){
  const refs=useRef({});
  useEffect(()=>{const el=refs.current[focus];if(el){el.focus();el.scrollIntoView({block:"nearest",behavior:"smooth"});}},[focus]);
  const Delta=({a,b})=>{const v=a-b;if(Math.abs(v)<.005)return null;return html`<span class="mono text-xs" style=${{color:v>0?"var(--q-crit)":"var(--q-mega)"}}>${v>0?"+":""}${v.toFixed(2)}</span>`;};
  const row=(label,val,extra)=>html`<div class="flex items-baseline justify-between gap-3 py-1.5" style=${{borderBottom:"1px solid var(--line)"}}><span class="text-muted text-xs">${label}</span><span class="mono text-sm">${val} ${extra||""}</span></div>`;
  return html`<div class="grid gap-5" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(300px,1fr))"}}>
    <div class="min-w-0 grid gap-3 content-start">
      <div class="flex items-center justify-between gap-2"><h3 class="m-0 text-base flex items-center gap-2"><${Icon} name="SlidersHorizontal" size=${16}/>Signal strength</h3>
        ${edited?html`<button onClick=${onReset} class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-md cursor-pointer" style=${{border:"1px solid var(--line)",background:"var(--surface)"}}><${Icon} name="RotateCcw" size=${13}/>Reset this driver</button>`:null}</div>
      <label for="mat" class="sr-only">Signal maturity</label>
      <select id="mat" class="field" value=${d.maturity} onChange=${e=>onMat(e.target.value)}>${MATS.map(m=>html`<option key=${m} value=${m}>${m} (${MATURITY_SCALE[m].toFixed(1)})</option>`)}</select>
      <div class="text-xs text-muted">Sheet value: <span class="mono">${d.raw}</span>${d.maturityNote?html`<br/>${d.maturityNote}`:null}</div>
      <div class="rounded-lg p-3" style=${{background:"var(--bg)"}}>
        <div class="eyebrow mb-1">Score build-up</div>
        ${row("Maturity rating M",s.M.toFixed(1))}
        ${row("Trade-off words in 2nd-order nodes",s.hits.length?s.hits.join(", "):"none")}
        ${row("Divergence uplift → D (×5)",`+${s.uplift.toFixed(2)} → ${s.D.toFixed(2)}`)}
        ${row("Uncertainty raw  0.6M + 0.4D",s.uRaw.toFixed(2))}
        ${row("Uncertainty_Norm",s.U.toFixed(2),html`<${Delta} a=${s.U} b=${base.U}/>`)}
        ${row("Cross-wheel node matches",s.iRaw)}
        ${row("Importance_Norm",s.I.toFixed(2),html`<${Delta} a=${s.I} b=${base.I}/>`)}
        <div class="flex items-center justify-between pt-2 text-sm"><span class="text-muted text-xs">Quadrant</span>
          <span class="font-semibold inline-flex items-center gap-1.5" style=${{color:Q[s.quadrant].col}}><${Icon} name=${Q[s.quadrant].icon} size=${14}/>${Q[s.quadrant].name}</span></div>
        ${s.quadrant!==base.quadrant?html`<div class="text-xs mt-1 text-muted">Moved from ${Q[base.quadrant].name}</div>`:null}
      </div>
      <div class="text-xs text-muted">Converges most with: ${Object.entries(s.links).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id,n],i)=>html`<span key=${id}>${i?", ":""}#${NUM[id]} ${DRIVERS.find(x=>x.id===id).title.split(" ").slice(0,4).join(" ")}… (${n})</span>`)}</div>
    </div>
    <div class="min-w-0 grid gap-3 content-start" style=${{gridColumn:"span 2 / span 2"}}>
      <h3 class="m-0 text-base flex items-center gap-2"><${Icon} name="PenLine" size=${16}/>Edit wheel nodes</h3>
      <p class="m-0 text-xs text-muted">Changes re-tag themes and trade-off words as you type, then re-score all 25 drivers. Scores are normalised across the set, so other dots may shift slightly.</p>
      <div class="grid gap-3" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))"}}>
      ${d.w.map(([f,kids],fi)=>html`<div key=${fi} class="grid gap-2 content-start rounded-lg p-2.5" style=${{border:"1px solid var(--line)"}}>
          <label class="eyebrow" for=${"n-"+fi}>1st order · ${fi+1}</label>
          <textarea id=${"n-"+fi} rows="2" class="field font-medium" ref=${el=>refs.current[String(fi)]=el} onFocus=${()=>setFocus(String(fi))} value=${f} onChange=${e=>onText(fi,null,e.target.value)}></textarea>
          ${kids.map((k,ki)=>html`<div key=${ki} class="grid gap-1 pl-3" style=${{borderLeft:"2px solid var(--line)"}}>
            <label class="eyebrow" for=${"n-"+fi+"-"+ki}>2nd order · ${fi+1}.${ki+1}</label>
            <textarea id=${"n-"+fi+"-"+ki} rows="2" class="field text-sm" ref=${el=>refs.current[fi+"-"+ki]=el} onFocus=${()=>setFocus(fi+"-"+ki)} value=${k} onChange=${e=>onText(fi,ki,e.target.value)}></textarea>
            <div class="text-xs flex flex-wrap gap-1">${s.nodes.find(n=>n.order===2&&n.fi===fi&&n.ki===ki).themes.map(t=>html`<span key=${t} class="px-1.5 rounded" style=${{background:"var(--sunk)"}}>${t}</span>`)}
              ${frictionHits(k).map(h=>html`<span key=${h} class="px-1.5 rounded font-semibold" style=${{background:"var(--q-crit-t)",color:"var(--fric)"}}>${h}</span>`)}</div>
          </div>`)}
        </div>`)}
      </div>
    </div>
  </div>`;
}

/* ---------- Ledger ---------- */
function Ledger({drivers,scores,sel,setSel}){
  const [sort,setSort]=useState("quadrant");
  const order={critical:0,megatrend:1,wildcard:2,background:3};
  const rows=scores.map(s=>({s,d:drivers.find(x=>x.id===s.id)})).sort((a,b)=>sort==="quadrant"?(order[a.s.quadrant]-order[b.s.quadrant]||b.s.I-a.s.I):sort==="I"?b.s.I-a.s.I:sort==="U"?b.s.U-a.s.U:NUM[a.s.id]-NUM[b.s.id]);
  const th=(k,l,al="left")=>html`<th class="py-2 px-2 font-medium text-xs text-muted cursor-pointer select-none" style=${{textAlign:al,whiteSpace:"nowrap"}} onClick=${()=>setSort(k)}>${l}${sort===k?" ↓":""}</th>`;
  return html`<div style=${{overflowX:"auto"}}><table class="w-full" style=${{borderCollapse:"collapse",minWidth:680}}>
    <thead><tr style=${{borderBottom:"1px solid var(--line)"}}>${th("n","#")}${th("n","Driver")}${th("n","Domain")}${th("n","Maturity")}${th("I","Importance","right")}${th("U","Uncertainty","right")}${th("quadrant","Quadrant")}</tr></thead>
    <tbody>${rows.map(({s,d})=>html`<tr key=${s.id} onClick=${()=>setSel(s.id)} class="cursor-pointer" style=${{borderBottom:"1px solid var(--line)",background:s.id===sel?"var(--sunk)":"transparent"}}>
      <td class="py-2 px-2 mono text-xs text-muted">${NUM[s.id]}</td>
      <td class="py-2 px-2 text-sm">${d.title}</td>
      <td class="py-2 px-2 text-xs"><span class="inline-flex items-center gap-1.5"><span style=${{width:8,height:8,borderRadius:2,background:DCOL[d.domain]}}></span>${d.domain}</span></td>
      <td class="py-2 px-2 text-xs whitespace-nowrap">${d.maturity}</td>
      <td class="py-2 px-2 mono text-sm text-right">${s.I.toFixed(2)}</td>
      <td class="py-2 px-2 mono text-sm text-right">${s.U.toFixed(2)}</td>
      <td class="py-2 px-2 text-xs whitespace-nowrap" style=${{color:Q[s.quadrant].col,fontWeight:600}}>${Q[s.quadrant].short}</td></tr>`)}</tbody></table></div>`;
}

/* ---------- App ---------- */
function App(){
  const base=useMemo(()=>score(DRIVERS),[]);
  const [drivers,setDrivers]=useState(()=>{const e=loadEdits();if(e&&Array.isArray(e)&&e.length===25&&e.every((x,i)=>x.id===DRIVERS[i].id))return e;return clone(DRIVERS);});
  const [sel,setSel]=useState("kerb");
  const [focus,setFocus]=useState(null);
  const [moved,setMoved]=useState(null);
  const [showMethod,setShowMethod]=useState(false);
  const scores=useMemo(()=>score(drivers),[drivers]);
  useEffect(()=>saveEdits(drivers),[drivers]);
  useEffect(()=>setFocus(null),[sel]);
  const di=drivers.findIndex(x=>x.id===sel), d=drivers[di], s=scores[di], b=base[di];
  const tabsRef=useRef(null);
  useEffect(()=>{const el=tabsRef.current&&tabsRef.current.querySelector(`[data-id="${sel}"]`);if(el)el.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});},[sel]);
  const update=fn=>{setDrivers(prev=>{const n=clone(prev);fn(n[di]);return n;});setMoved(sel);clearTimeout(window.__mv);window.__mv=setTimeout(()=>setMoved(null),1400);};
  const edited=JSON.stringify(d)!==JSON.stringify(DRIVERS[di]);
  const anyEdited=drivers.some((x,i)=>JSON.stringify(x)!==JSON.stringify(DRIVERS[i]));
  return html`<div class="wrap grid gap-5">
    <header class="grid gap-3">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="eyebrow flex items-center gap-2"><${Icon} name="Compass" size=${14}/>Strategic Foresight · Singapore Urban Policy 2050</div>
        ${anyEdited?html`<button onClick=${()=>{setDrivers(clone(DRIVERS));}} class="inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-md cursor-pointer" style=${{border:"1px solid var(--line)",background:"var(--surface)"}}><${Icon} name="RotateCcw" size=${13}/>Reset all edits</button>`:null}
      </div>
      <h1 class="m-0" style=${{fontSize:"clamp(28px,4.2vw,46px)",lineHeight:1.05,fontWeight:700}}>Singapore 2050 Foresight Lab</h1>
      <p class="m-0 max-w-3xl text-muted" style=${{fontSize:16}}><span class="text-ink font-medium">Problem statement:</span> How can Singapore navigate changing demographic, social, and technological demands for urban space by 2050 to maintain a high quality of life (QOL)?</p>
    </header>

    <${Overview} drivers=${drivers} scores=${scores}/>

    <div class="grid gap-5" style=${{gridTemplateColumns:"repeat(auto-fit,minmax(min(100%,520px),1fr))"}}>
      <section class="panel p-4 min-w-0 grid gap-3 content-start">
        <div class="flex flex-wrap items-baseline justify-between gap-2">
          <h2 class="m-0 text-lg flex items-center gap-2"><${Icon} name="Grid2x2" size=${18}/>Foresight matrix</h2>
          <button onClick=${()=>setShowMethod(!showMethod)} class="text-xs inline-flex items-center gap-1 cursor-pointer bg-transparent border-0 p-0" style=${{color:"var(--accent)"}} aria-expanded=${showMethod}><${Icon} name="Info" size=${13}/>${showMethod?"Hide method":"How scores work"}</button>
        </div>
        ${showMethod?html`<div class="text-xs rounded-lg p-3 grid gap-2" style=${{background:"var(--bg)"}}>
          <div><b>Uncertainty</b> = 0.6 × Maturity + 0.4 × Divergence. Maturity: Happening Now 1.0 · Emerging 2.5 · Weak Signal 4.0 · Black Jellyfish / Black Swan / Unconfirmed 5.0. Divergence counts distinct trade-off words in the six 2nd-order nodes (${FRICTION.join(", ")}): 1 word +0.5, 2 words +0.75, 3+ words +1.0, scaled ×5 onto the rating range.</div>
          <div><b>Importance</b> = cross-wheel convergence. Every 1st- and 2nd-order node is tagged with shared urban themes (e.g. ${Object.keys(THEMES).slice(0,6).join(", ")}). Each node scores 1 for every other driver's wheel holding a node with a shared theme.</div>
          <div>Both scores are min–max normalised to 1.0–5.0 across the 25 drivers. Quadrant split at 3.0.</div></div>`:null}
        <${Matrix} drivers=${drivers} scores=${scores} sel=${sel} setSel=${setSel} moved=${moved}/>
        <div class="flex flex-wrap gap-x-3 gap-y-1 text-xs text-muted">${DOMAINS.map(([dm])=>html`<span key=${dm} class="inline-flex items-center gap-1.5"><span style=${{width:9,height:9,borderRadius:99,background:DCOL[dm]}}></span>${dm}</span>`)}</div>
      </section>

      <section class="panel p-4 min-w-0 grid gap-3 content-start">
        <div class="flex items-center justify-between gap-2">
          <h2 class="m-0 text-lg flex items-center gap-2"><${Icon} name="Orbit" size=${18}/>Futures wheel</h2>
          <div class="flex gap-1">
            <button aria-label="Previous driver" onClick=${()=>setSel(drivers[(di+24)%25].id)} class="p-1.5 rounded-md cursor-pointer" style=${{border:"1px solid var(--line)",background:"var(--surface)"}}><${Icon} name="ChevronLeft" size=${15}/></button>
            <button aria-label="Next driver" onClick=${()=>setSel(drivers[(di+1)%25].id)} class="p-1.5 rounded-md cursor-pointer" style=${{border:"1px solid var(--line)",background:"var(--surface)"}}><${Icon} name="ChevronRight" size=${15}/></button>
          </div>
        </div>
        <div ref=${tabsRef} class="tabs flex gap-1.5 overflow-x-auto pb-1" role="tablist">
          ${drivers.map((x,i)=>{const on=x.id===sel;const q=scores[i].quadrant;return html`<button key=${x.id} data-id=${x.id} role="tab" aria-selected=${on} onClick=${()=>setSel(x.id)} title=${x.title}
            class="shrink-0 text-xs px-2.5 py-1.5 rounded-md cursor-pointer inline-flex items-center gap-1.5"
            style=${{border:"1px solid "+(on?"var(--ink)":"var(--line)"),background:on?"var(--ink)":"var(--surface)",color:on?"var(--bg)":"var(--ink)"}}>
            <span style=${{width:6,height:6,borderRadius:99,background:Q[q].col}}></span><span class="mono">${i+1}</span>${x.title.split(" ").slice(0,3).join(" ")}</button>`;})}
        </div>
        <div class="grid gap-1">
          <div class="flex flex-wrap items-center gap-2 text-xs">
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded" style=${{background:"var(--sunk)"}}><span style=${{width:8,height:8,borderRadius:2,background:DCOL[d.domain]}}></span>${d.domain}</span>
            <span class="px-2 py-0.5 rounded" style=${{background:"var(--sunk)"}}>${d.maturity}</span>
            <span class="px-2 py-0.5 rounded font-semibold" style=${{background:Q[s.quadrant].tint,color:Q[s.quadrant].col}}>${Q[s.quadrant].short}</span>
            <span class="text-muted">Scanned by ${d.scanner}</span>
          </div>
          <p class="m-0 text-sm">${d.desc}</p>
          <p class="m-0 text-xs text-muted"><b class="text-ink">Initial impact:</b> ${d.impact}</p>
          ${d.domainNote?html`<p class="m-0 text-xs text-muted">${d.domainNote}</p>`:null}
        </div>
        <${Wheel} d=${d} s=${s} focus=${focus} setFocus=${setFocus}/>
      </section>
    </div>

    <section class="panel p-4 md:p-5 grid gap-3">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <h2 class="m-0 text-lg flex items-center gap-2"><${Icon} name="FlaskConical" size=${18}/>Student refinement · #${di+1} ${d.title}</h2>
        <span class="text-xs text-muted">Edits stay in this browser only</span>
      </div>
      <${Refine} d=${d} s=${s} base=${b} focus=${focus} setFocus=${setFocus} edited=${edited}
        onMat=${v=>update(x=>{x.maturity=v})}
        onText=${(fi,ki,v)=>update(x=>{if(ki===null)x.w[fi][0]=v;else x.w[fi][1][ki]=v;})}
        onReset=${()=>setDrivers(prev=>{const n=clone(prev);n[di]=clone(DRIVERS[di]);return n;})}/>
    </section>

    <section class="panel p-4 grid gap-3">
      <h2 class="m-0 text-lg flex items-center gap-2"><${Icon} name="ListOrdered" size=${18}/>All 25 drivers</h2>
      <${Ledger} drivers=${drivers} scores=${scores} sel=${sel} setSel=${id=>{setSel(id);window.scrollTo({top:0,behavior:"smooth"});}}/>
    </section>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>

</body></html>
