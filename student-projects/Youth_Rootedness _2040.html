<script>
const SIGNALS=[{"title": "Changing familial expectations/values", "desc": "fillial piety vs western desires \n-> move-out vs stay with family", "signif": "", "why": "", "impact": "", "status": "emerging liberal", "actors": "", "domain": "", "strength": "", "source": "", "id": "G1", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[rootedness] Co-Creation of Housing via Youth Advisory Channels: Demand for co-creation in housing design/neighbourhood", "desc": "The establishment of institutionalized channels like the NYC–HDB Youth Advisory Panel directly involves young Singaporeans in shaping the flat-buying journey, estate features, and housing policies. Housing transitions from a government-allocated good to a co-designed public environment", "signif": "", "why": "", "impact": "* Instills a strong sense of ownership and agency over the physical and social landscape of Singapore. \n* Ensures public housing policies remain agile and aligned with evolving youth family structures and flexible work arrangements. \n* Increases civic trust and institutional buy-in among younger cohorts", "status": "Weak signal — announced in Parliamentary responses; initial setup phase between NYC and HDB; limited academic or empirical evaluation so far (increasing)", "actors": "", "domain": "CLC: Collaborative Ecosystem", "strength": "Weak Signal", "source": "https://www.mccy.gov.sg/about-us/news-and-resources/addressing-youth-aspirations-on-housing--employment--and-family/", "id": "G2", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Preference for AI companionship over humans", "desc": "", "signif": "", "why": "", "impact": "", "status": "emerging", "actors": "", "domain": "Technological (STEEP)", "strength": "", "source": "", "id": "G3", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Declining age of private-home owners", "desc": "Median age of Singaporean buyers of new private homes have fallen. 2015: 45, 2023: 39. The share of buyers aged 26–35 rose from 9% of sales in 2015 to 35% in 2023, while the 46–55 age group’s share fell from 33% in 2015 to 17% in 2023.", "signif": "", "why": "", "impact": "Younger houesholds are entering private estates (condos, landed property) earlier than before. Private estates have very little government intervened community infrastrcture and programmes which undermines neighbourhood rootedness", "status": "", "actors": "", "domain": "Economic (STEEP)", "strength": "Emerging - trend with substantive evidence, but downstream effect on “rootedness policy for private estates” is speculative", "source": "ERA Singapore Research, “Singapore’s New Private Home Market Sees Rising Demand from Young Singaporeans” (18 Jan 2024), based on proprietary sample of 37,000 Singaporean buyers, sourced from URA data: https://www.era.com.sg/research-articles/new-private-home-demand-young-singaporeans", "id": "G4", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Shortened occupancy period", "desc": "", "signif": "", "why": "", "impact": "", "status": "already there?", "actors": "", "domain": "", "strength": "Weak Signal", "source": "", "id": "G5", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Changing housing aspiration", "desc": "Preferences for BTO vs Co-living spaces", "signif": "", "why": "", "impact": "", "status": "already there?", "actors": "", "domain": "", "strength": "Weak Signal", "source": "", "id": "G6", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[belonging] Independent Living & Flexible Transitional Housing", "desc": "Provision of discounted, flexible co-living and shared rental units (such as the SG Youth Plan Independent Living Initiative across Jalan Besar, Boon Lay, and Bukit Timah) to give young adults transitional housing options before marriage or flat purchase", "signif": "", "why": "", "impact": "* Normalizes non-linear pathways to adulting and independent living prior to permanent HDB flat ownership. \n* Lowers structural barriers for young adults seeking spatial autonomy and lifestyle flexibility", "status": "Weak signal — 100+ co-living units launched under 3 private operator partnerships (NYC/MCCY); unlinked to HDB core stock; pilot stage monitoring", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "source 1 : https://www.straitstimes.com/singapore/job-tasters-adulting-101-and-500-curiosity-credits-part-of-new-five-year-plan-for-spore-youth \nsource 2: https://sg.news.yahoo.com/youth-worry-jobs-rising-costs-054709357.html?guccounter=1&guce_referrer=aHR0cHM6Ly93d3cucGVycGxleGl0eS5haS8&guce_referrer_sig=AQAAAHpVRf-QfxElVFcA4ed3z_yZeFvHlBnU-r8-urvsCmekQNnOqwpILh_cNffzZtmpvgVt8N-l7UKe915xqPpyOcG4YrYAWPMT1_SYcbFiQ-PpNQhCBgGFgOG4WzBYaRWHq7tLiYDG9Zof6AG730w33081lzhny92lmCPo8lLEmMBX", "id": "G7", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "\"Home” is becoming something you carry with you", "desc": "Youths are explicitly asking how to stay connected to Singapore while pursuing aspirations in the global market. Therefore, rootedness could become more about identity and a place to return to than about daily neighbourly ties. By 2050 a youth might “belong” to a neighbourhood they only live in for part of their life.", "signif": "", "why": "", "impact": "", "status": "", "actors": "", "domain": "", "strength": "Weak", "source": "https://www.pmo.gov.sg/newsroom/sm-lee-hsien-loong-at-the-nus120-kent-ridge-ministerial-forum-2025-qna/", "id": "G8", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "20-minute towns", "desc": "Under the Long Term Master Plan 2040, most journeys to the neighbourhood centre are targetted to be reachable within 20 minutes by public, active and shared transport. Therefore by 2050, neighbourhood centres may become the default for daily life, which may strengthen local rootedness.", "signif": "", "why": "", "impact": "", "status": "", "actors": "", "domain": "CLC: Integrated Master Planning", "strength": "Emerging", "source": "Source 1: https://www.mot.gov.sg/news-resources/newsroom/speech-by-senior-minister-of-state-janil-puthucheary-at-the-ministry-of-transports-committee-of-supply-debate-2019-on-bringing-singapore-together/ Source 2: https://www.ura.gov.sg/land-planning/long-term-plan/public-engagement-journey/themes/future-of-living/", "id": "G9", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "More youth moving abroad", "desc": "With more youth opting for emigration, they are less likely to feel a strong sense of rootedness to their neighbourhoods.", "signif": "", "why": "", "impact": "", "status": "", "actors": "", "domain": "", "strength": "Weak", "source": "https://lkyspp.nus.edu.sg/docs/default-source/ips/cna_more-singaporeans-going-abroad-but-are-no-less-singaporean-for-it_020917-pdf.pdf?sfvrsn=1b799f0b_0", "id": "G10", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Sense of rootedness stemming from networks rather than physical spaces", "desc": "", "signif": "", "why": "", "impact": "", "status": "", "actors": "", "domain": "", "strength": "", "source": "", "id": "G11", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Creation of rootedness from interest-based communities rather than residential neighbourhoods", "desc": "Youths may develop stronger attachments to communities formed around shared interests than to their residential neighbourhoods", "signif": "", "why": "", "impact": "* Rootedness may become less dependant on where youths live and more on where they socalizae and find a sense of belonging. While it may weaken proximity-based neighbourhood ties, it can create cross-neighbourhood connections", "status": "Weak/Emerging - Currently there will be 12 new third spaces being developed", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "https://www.youthplan.gov.sg/connected/developing-third-spaces/", "id": "G12", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[belonging] Youth \"Third Spaces\" as Localized Social Infrastructure", "desc": "Creation of dedicated, non-commercial youth \"third spaces\" in residential neighborhoods (including within Residents' Networks, Community Clubs, and the Somerset Belt precinct) to foster cross-background interactions", "signif": "", "why": "", "impact": "* Normalizes inclusive, low-pressure organic social interactions outside of school or formal workplaces. \n * Turns local neighborhood spaces into youth-driven social and creative anchor points. \n* Mitigates youth loneliness and shrinking social networks through physical proximity.", "status": "Weak signal — 12 third spaces being established across Singapore by end-2026; major overhaul of Somerset Belt precinct targeted for completion by 2028.", "actors": "", "domain": "CLC: High Quality of Life", "strength": "Weak Signal", "source": "Source 1: https://www.straitstimes.com/singapore/job-tasters-adulting-101-and-500-curiosity-credits-part-of-new-five-year-plan-for-spore-youth\nSource 2: https://www.mccy.gov.sg/about-us/news-and-resources/building-a-singapore-with-and-for-our-youths/", "id": "G13", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Neighbourhood design and arrangement of shared spaces determining creation of relationships", "desc": "Connections may be spatially mediated. Neighbourhood design and the arrangement of shared spaces influence how residents interact and form social connects, indicateing that youths' neighbourhood rootedness may depend not only on living near others, but also having accessible spaces that facilitate meaningful social interactions", "signif": "", "why": "", "impact": "* Neighbourhood layouts and shared spaces may influnece opportunities for residents to interact and participate in communities", "status": "Weak - Unclear if it represents a broader shift in how youths develop neighbouthood rootedness", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "https://www.sciencedirect.com/science/article/abs/pii/S0378873325000899", "id": "G14", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[rootedness] Clearer and Earlier Routes to Asset-Based Belonging", "desc": "Home ownership continues to be a core anchor of national rootedness in Singapore by providing citizens with a tangible financial asset and long-term stake in the country. As youth marriage and lifestyle aspirations shift, early access to affordable public housing (or intermediate co-living/rental transitions) ensures public housing remains an effective pillar of social mobility and stability", "signif": "", "why": "", "impact": "* Strengthens national identity and long-term commitment to remaining in Singapore\n* Prevents youth alienation or economic friction caused by housing unaffordability during key life-stage transitions.\n* Encourages early financial planning and wealth accumulation via public assets.", "status": "Weak signal — discussed in local commentary & Youth Plan engagements; foundational policy in public literature; active inter-ministry reviews underway (MND, MCCY)", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "https://knowledge.csc.gov.sg/ethos-issue-02/public-housing-in-singapore/", "id": "G15", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[rootedness] Housing Estates as Community Integration Platforms", "desc": "Housing precincts and new towns are increasingly designed beyond basic shelter to serve as active social platforms that promote daily, organic interactions among diverse resident demographics. Features include mid-level communal spaces, precinct pavilions, shared green hubs, and integrated multi-use spaces.", "signif": "", "why": "", "impact": "* Fosters deeper micro-community ties and a localized sense of place among younger generations. \n * Enhances social cohesion across different socio-economic and ethnic backgrounds through shared living environments. \n* Transforms HDB precincts into living cultural hubs rather than strictly residential spaces.", "status": "Weak signal — emerging in urban planning exhibitions (URA Long-Term Plan); initial pilot designs in new estates (e.g., Punggol, Tengah); growing academic focus on urban sociology", "actors": "", "domain": "CLC: High Quality of Life", "strength": "Weak Signal", "source": "https://www.ura.gov.sg/land-planning/long-term-plan/space-for-our-dreams-exhibition/live/", "id": "G16", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[belonging] Inclusive, Climate-Resilient Neighborhood Design", "desc": "Integration of barrier-free design, biophilic \"City in Nature\" greenery, sky gardens, and climate-adaptation features into residential estates, reflecting feedback from over 1,200 youth engaged in URA's Long-Term Plan Review", "signif": "", "why": "", "impact": "* Shifts youth belonging from purely financial asset ownership to pride in sustainable and accessible local environments. \n* Enhances intergenerational living by seamlessly accommodating aging residents, differently-abled youth, and young families. \n* Aligns public housing infrastructure with youth priorities around climate action and urban resilience.", "status": "Weak signal — documented in URA Long-Term Plan Review (LTPR) findings; pilot designs rolling out in new towns like Tengah and Punggol.", "actors": "", "domain": "Singapore Green Plan: City in Nature", "strength": "Weak Signal", "source": "Source 1: https://www.ura.gov.sg/news/media/pr22-09/\nSource 2: https://www.ura.gov.sg/land-planning/long-term-plan/space-for-our-dreams-exhibition/live/", "id": "G17", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "[belonging] Civic Attachment via Participatory Ground-Up Activations", "desc": "Institutionalization of youth-led grant channels, participatory budgeting, and policy networks (e.g., $20M Youth Action Marketplace, SG Youth Policy Network, Youth Panels) that empower youth to fund and build estate projects.", "signif": "", "why": "", "impact": "* Converts public housing estates into active sites of civic contribution rather than passive residential spaces. \n* Strengthens institutional trust and civic agency by giving youth direct budget authority and policy advisory roles. \n* Normalizes community volunteering in local priority areas like mental well-being, sustainability, and eldercare.", "status": "Weak signal — $20M committed over 5 years for up to 3,000 projects; inaugural Youth Action Marketplace (\"Impact, IRL\") held in late 2026; Policy Network launching Q1 2027.", "actors": "", "domain": "CLC: Collaborative Ecosystem", "strength": "Weak Signal", "source": "https://www.mccy.gov.sg/about-us/news-and-resources/building-a-singapore-with-and-for-our-youths/", "id": "G18", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Shared Experiential Anchors (Mass Experiential Resilience)", "desc": "Universal expansion of shared outdoor experiential learning programmes (such as scaling the MOE-Outward Bound Singapore Challenge to 100% of Sec 3 cohorts at the new Coney Island campus) to build early collective resilience and cross-school bonding", "signif": "", "why": "", "impact": "* Creates common, nationwide emotional and social touchpoints for youth prior to entering higher education or workforce transitions. \n* Deepens social mixing and breaks down socio-economic silos across different school types and backgrounds. \n* Fosters a shared, rugged national identity that anchors long-term rootedness in Singapore", "status": "Weak signal — OBS Coney Island campus opening late 2026; targeting 100% cohort coverage (~40,000 students annually) by 2030; features wheelchair-accessible high elements.", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "https://www.mccy.gov.sg/about-us/news-and-resources/building-a-singapore-with-and-for-our-youths/", "id": "G19", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Environmental conditions", "desc": "Weather condition such as the haze creates an unsafe conditions for people to stay out. However this may push people toward staying at home or at places like air-conditioned areas provided within the community.", "signif": "", "why": "", "impact": "* Forces people to stay indoors which can include within the spaces of their own homes, or spaces created by the government", "status": "Weak Signal - uncertain of which people will choose, and whether it will lead to increased rootedness", "actors": "", "domain": "Social (STEEP)", "strength": "Weak Signal", "source": "", "id": "G20", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Policies being family-oriented, prioritising proximity", "desc": "Government actively incentivises youth to live near (not just with) parents", "signif": "", "why": "", "impact": "Rootedness gets anchored to family-care logistics (childcare, eldercare) rather than estate identity or peer networks", "status": "Proximity Housing Grant, Multi-Generation Priority Scheme: where parents and their married child jointly apply for two flats in the same BTO project; uptake was already 5,217 households and $100.8 million in grants by the scheme’s early years, with 95% of applicants buying to live closer to or with parents. Property analysts now expect multigenerational living to remain an increasingly important segment as the population ages and childcare costs rise.", "actors": "", "domain": "", "strength": "not weak, maybe emerging", "source": "", "id": "G21", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Secularisation (Liberalisation? Non-Religious)", "desc": "Youth are increasigly less affliatied with religion. Places of religious interest are Singapore’s oldest neighbourhood-level community institutions (temples, churches, mosques as hyperlocal gathering points).", "signif": "", "why": "", "impact": "A long-standing, low-cost community infrastructure (weekly congregation, cross-generational contact) weakens exactly as the state is trying to build new “third spaces” to replace that function.\n\n24.2% of residents aged 15–24 reported no religious affiliation in the 2020 census, versus 15.2% of those 55 and older, with the 25–34 age group even higher at 26.2%. The trend has accelerated since: the 2025 General Household Survey recorded the first-ever decline in Christianity’s share of the resident population, from 18.9% to 17.1%, alongside a rise in “no religion” from 20% in 2020 to 23.9% in 2025.", "status": "", "actors": "", "domain": "", "strength": "Moderate", "source": "", "id": "G22", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Hawker Centre Succession", "desc": "Hawker centres function as cross-income, cross-generational “third spaces,” but the hawker trade is ageing even as the government expands physical capacity. There is also little renewal of the trade with the younger generation. As of a 13 Nov 2024 parliamentary speech, the median age of Singapore’s hawkers is 60 years old. There are 121 hawker centres today, 14 of which are managed by Socially-conscious Enterprise Hawker Centre (SEHC) operator.", "signif": "", "why": "", "impact": "The social function of hawker centres are threatened as the trade is not surviving generational turnover. If the next generation loses the original 'third space' , new and upcoming spaces have to be designed for social mixing and neighbourhood rootedness", "status": "NEA had run a Hawkers Succession Scheme, launched on 1 Jan 2022, seven veteran hawkers have enrolled; two have completed stall transfer to successors, and a third was in progress, as of 8 May 2024 (Ministerial written parliamentary reply). \nNew-entrant pipeline (broader, across 3 NEA programmes incl. HSS): over 70 hawkers had joined the trade through NEA/SEHC programmes as of Nov 2024, with a median age of 37. \nHawker centre construction: the government committed in 2011/2015 to build 20 new hawker centres in total, expected to complete by 2027; as of Nov 2024, 14 of these new centres are in operation and the locations of the other 6 have been announced.officially launched", "actors": "", "domain": "Social (STEEP)", "strength": "Moderate - directly government-tracked via Parliament, consistent numbers across multiple official replies", "source": "1) MSE, Response to Motion on Hawker Culture, Dr Koh Poh Koon, 13 Nov 2024: https://www.mse.gov.sg/latest-news/response-to-motion-on-hawker-culture-by-senior-minister-of-state-ministry-of-sustainability-and-the-environment-dr-koh-poh-koon/ — 2) MSE, Written Reply to PQ on Hawkers Succession Scheme, Minister Grace Fu, 8 May 2024: https://www.mse.gov.sg/latest-news/written-reply-to-pq-on-hawkers-succession-scheme/ — 3) MSE, Written reply on Criteria for Setting up Hawker Centres and Wet Markets, Grace Fu, 4 Sep 2020 (source of the “20 by 2027” commitment): https://www.mse.gov.sg/latest-news/parliament-q--a-on-setting-up-hawker-centres-and-wet-markets/", "id": "G23", "owner": "Group log", "log": "Youth rootedness (group)"}, {"title": "Potential lowering of BTO age-35 cap and raising of income ceilings by MND", "desc": "SMS Sun Xueling stated in Parliament that HDB BTO income ceilings may be raised and the age-35 eligibility cap for singles could be lowered once supply constraints ease.", "signif": "Signals a potential structural policy shift by 2040 away from restricting single applicants, expanding public housing accessibility beyond nuclear family units.\nHong Kong’s econometric data shows how delaying housing access to singles creates a pent-up pool of buyers that leads to sudden price spikes when they enter the market.", "why": "It is a direct response to rising solo-living demographics; challenges long-standing eligibility caps that are rooted in traditional family-first allocation paradigms.", "impact": "MED: Could trigger a surge in BTO demand among younger singles (<35), exacerbating spatial allocation pressures in mature/central estates if supply does not keep pace.", "status": "Weak signal / Emerging policy intent - publicly raised in Parliament, contingent on future flat supply targets (2025–2027) and is under review.", "actors": "MND, HDB, unmarried citizens under 35, middle-income single-earner households, young working professionals.", "domain": "Political / Legislative (STEEP)", "strength": "Weak", "source": "The Straits Times (2025). Cheung, W., Chan, J., & Monkkonen, P. (2020). Marriage-induced homeownership as a driver of housing booms: evidence from Hong Kong. Housing Studies, 35, 720 - 742. https://doi.org/10.1080/02673037.2019.1632422", "id": "GR1", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Continuous decline in average household size and rise in one-person resident households in Singapore.", "desc": "SingStat population trends show Singapore’s average resident household size steadily shrinking, alongside a structural rise in single-person households driven by delayed marriage, non-marriage, and solo aging.", "signif": "Demands a fundamental shift in Singapore’s public housing model - transitioning from family-centric 4-room and 5-room standard allocations toward modular micro-units, shared facilities, and higher proportions of 2-room Flexi flats by 2040. East Asian markets (Tokyo, Seoul) adapted to solo-living trends by shifting developer supply from nuclear-family layouts to super-compact studio units.", "why": "Highlights the growing mismatch between traditional HDB eligibility frameworks (anchored on nuclear families) and the reality of a diversifying demographic profile.", "impact": "HIGH: Could create structural shortages of small public housing flats, escalates resale market prices for smaller units, and increases spatial concentration pressures in mature or central estates accessible to single buyers.", "status": "Strong / Sustained trend - backed by decennial Census and annual General Household Survey data.", "actors": "MND, HDB, unmarried citizens, young solo professionals, aging singles.", "domain": "Social (STEEP) / CLC: High quality of life", "strength": "Strong", "source": "Department of Statistics Singapore (2025), Ronald, R., Druta, O., & Godzik, M. (2018). Japan’s urban singles: negotiating alternatives to family households and standard housing pathways. Urban Geography, 39, 1018 - 1040. https://doi.org/10.1080/02723638.2018.1433924", "id": "GR2", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Growth of co-living housing for single residents and young renters.", "desc": "One-person households now account for nearly 1 in 6 resident households (~16.7% in 2025). While the government has expanded public housing access for singles (e.g., islandwide 2-room Flexi BTO access leading to oversubscribed applications), a structural supply-demand gap persists. Consequently, institutional co-living is rapidly expanding (projected addressable demand of 45,840 keys by 2028 vs. ~10,000 active keys) as a flexible rental alternative.\n\nThis pattern also exists internationally e.g., US, Northern Europe, Japan, SEA, showing that co-living is a global structural shift driven by mass urbanization and lifestyle flexibility.", "signif": "Pushes policymakers (MND/HDB) and institutional investors to expand non-traditional, rental, and flexible housing models alongside traditional family-centric homeownership by 2040.", "why": "Highlights how changing demographic realities (rising singlehood, smaller families, aging solo seniors) are outpacing the traditional family-centric public housing framework.", "impact": "MED: Intensified competition for small BTO flats among singles, growing reliance on private co-living/rental markets for younger solo dwellers, and an urgent need for community-based support for aging solo residents.", "status": "Emerging Trend", "actors": "MND, HDB, co-living operators, real estate investors, single citizens, solo seniors", "domain": "Social (STEEP) / CLC: High Quality of Life", "strength": "Strong", "source": "Li, C. (2026, Sept 17). Making room for co-living in Singapore as investors commit, demand broadens. The Business Times; CNA TODAY (2026, Sept 11). Young, old, single, divorced: The many faces of Singapore’s one-person households; The Straits Times (2024, Oct 21). Overwhelming demand from singles for two-room flexi HDB flats.\n\nDruta et al. (2021); Kottmann (2021); Yeung & Cheung (2015).", "id": "GR3", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "BTO income ceiling raised for singles ($8,000) under the Single Singapore Citizen Scheme (SSCS) / Joint Singles Scheme (JSS) and families ($16,000) alongside pro-family ballot weighting", "desc": "PM Lawrence Wong announced at NDR 2026 an increase in the BTO monthly income ceiling to $8,000 for singles and $16,000 for families, alongside uncapped additional BTO ballot chances for first-timers per child.", "signif": "Expands public housing access to higher-income singles and middle-income couples, while re-emphasizing state preference for nuclear families with children through structural ballot advantages.", "why": "Reflects state adaptation to rising median incomes ($12,446 in 2025) and delayed marriage, while preserving the foundational policy paradigm prioritizing family formation over solo-living.", "impact": "MED: Increases applicant competition for 2-room Flexi BTO flats among singles, while widening the structural access gap between unmarried citizens and families with children.", "status": "Policy enacted — Effective Aug 24, 2026 for HFE letter applications; ballot chances take effect Feb 2027.", "actors": "Prime Minister's Office, MND, HDB, single citizens earning $7k–$8k, first-time parents.", "domain": "Political / Legislative (STEEP) / CLC: Dynamic Urban Governance", "strength": "Strong", "source": "The Straits Times (2026)", "id": "GR4", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Strong preference for buying new public flats among singles in Singapore who do not plan to marry.", "desc": "HDB’s 5-year survey shows that 80% of single occupiers do not plan to marry. Over 66% of them want to move out, and 72% prefer to buy their own home rather than rent. Most prefer new BTO flats for affordability, leading to high application rates (5 to 8 applicants per flat in 2025) after eligibility was expanded islandwide.", "signif": "Pushes MND and HDB to review the age 35 floor, raise income limits ($7,000 ceiling), and build more 2-room flats to meet long-term demand.", "why": "Shows that young singles view homeownership as essential for independence, challenging traditional family-first housing policies.", "impact": "MED: High competition for BTO flats, higher resale market prices for singles who miss out on BTOs, and a trend of singles living near parents to keep strong family ties without living under the same roof", "status": "Emerging Policy Shift / High Market Demand.", "actors": "MND, HDB, unmarried citizens (aged 21–54), parents of singles", "domain": "Social / Policy (STEEP) / CLC: High Quality of Life", "strength": "Strong", "source": "The Straits Times (Nov 2025 & Oct 2024 reporting on HDB Sample Household Survey & BTO launches).", "id": "GR5", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Emergence of alternative living arrangements: SG Youth Plan Co-Living Initiative by Ministry of Culture, Community and Youth (MCCY) and Pre-35 Residential Independence", "desc": "The SG Youth Plan launched a state-facilitated co-living pilot set aside by private operators at discounted rates for Singaporeans aged 21–35, receiving over 600 applications for ~100 units within weeks (>6x oversubscribed), predominantly from single youths seeking personal space and independent living.", "signif": "Signals the emergence of an \"alternative pathway\" from the traditional housing journey for those below age 35 and before marriage. If co-living evolves from a temporary phase into a permanent lifestyle norm, it will disrupt traditional life-stage assumptions and demand modular, flexible public rental options from MND/HDB.", "why": "Exposes the growing temporal and structural mismatch between young citizens' desire for residential independence in early adulthood (ages 21–34) and HDB's strict family-first allocation rules and age-35 BTO eligibility cap", "impact": "HIGH: Drives spatial and economic polarization (affluent young professionals afford $1,800–$2,000/month private co-living, while lower-income singles remain trapped at home) and drains young citizens' liquid wealth into commercial rents instead of CPF asset-building.", "status": "Emerging policy test", "actors": "MCCY, NYC, MND, HDB, co-living operators (Coliwoo, 1925 Quarters), young single citizens (aged 21–35).", "domain": "Social (STEEP) / CLC: High quality of life", "strength": "Emerging", "source": "Koh, F. (2026, Aug 20). Co-living an emerging housing option for young adults, but affordability and familiarity concerns remain.\n\nSG Youth Plan Co-Living Initiative. (2026, September 28). Ministry of Culture, Community & Youth. https://www.mccy.gov.sg/about-us/news-and-resources/sg-youth-plan-co-living-initiative/", "id": "GR6", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "\"Social Recession\" risk from shrinking family sizes, thinning friendships, and rising youth/solo isolation in Singapore.", "desc": "As married-with-children families drop below 50% of households, data from Institue of Policy Studies (IPS) shows Singaporeans' close friend networks are shrinking (from 10.7 in 2018 to 6.5 in 2024). 1 in 3 young adults (21–34) report feeling isolated, while volunteering hours dropped by 60%, threatening a \"social recession\" (decline in communal bonds).", "signif": "Demands that government agencies (MSF, People's Association, MND) build civic and community infrastructure (e.g., time banks, estate citizens' assemblies) beyond state-provided care by 2040.", "why": "Shows that shrinking households and rising singlehood weaken non-familial social support networks, placing greater strain on public mental health and senior care.", "impact": "HIGH: Growing urban loneliness, class-based social isolation (low-income residents have fewer close ties), and reduced community trust despite high trust in government institutions.", "status": "Weak signal", "actors": "MSF, People's Association, young adults, solo dwellers, lower-income households.", "domain": "Social / Cultural (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Thomas, N., Wong, K. L., & Goh, W. (2026, July 22). The other recession risk that Singapore should be wary of. CNA / Institute of Policy Studies (IPS).", "id": "GR7", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Rising costs of private tuition and enrichment driving child-rearing budgets toward $1 million.", "desc": "Middle-class parents are spending heavily on private tuition and enrichment classes to keep their children competitive. This discretionary spending pushes total child-rearing costs up to $1 million, making parenthood feel unaffordable.", "signif": "Pushes more middle-income couples to choose not to have children, driving Singapore's fertility rate lower by 2040.", "why": "Shows that low fertility is driven not just by basic living costs, but by intense pressure to pay for extra enrichment.", "impact": "MED: Widening educational gap between income groups and lower effectiveness of standard government baby grants.", "status": "Weak Signal / Emerging Trend.", "actors": "Middle-income parents, Ministry of Social and Family Development (MSF), tuition centers.", "domain": "Social / Economic (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "CNA (Apr 2026 reporting on child-rearing costs in Singapore).", "id": "GR8", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Shift in resident behavior from lifetime homeownership to shortened occupancy tenures.", "desc": "Empirical survey data indicates that only 38% of surveyed HDB occupants are first-time owners, with average occupancy durations dropping to 8–12 years in non-legacy estates as owners view flats as temporary stepping stones.", "signif": "Rejects the long-standing policy assumption of \"one flat for life,\" requiring MND to introduce flexible public rental schemes, subscription-style public housing, or enhanced resale liquidity for single buyers by 2040.", "why": "Highlights changing social values where citizens prioritize residential flexibility and career mobility over lifelong commitment to a single HDB unit.", "impact": "HIGH: Increases churn and transaction volumes in the HDB resale market while intensifying spatial demand for central, highly accessible small flats.", "status": "Weak signal / Empirical survey trend.", "actors": "MND, HDB, young working professionals, single buyers, real estate market.", "domain": "Social / Economic (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Tamura, J., & Fang, K. (2022). Quality of Public Housing in Singapore: Spatial Properties of Dwellings and Domestic Lives. Architecture, 2(1), 18–30.", "id": "GR9", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Singles locking up too much CPF money in housing, leaving them cash-poor in retirement.", "desc": "High national housing wealth lockup (75% of assets at age 50) creates disproportionate CPF depletion and retirement liquidity risks for single-earner households.\nIn Tokyo and Seoul, non-family formers experience stalled housing mobility and remain trapped in rentals, preventing asset accumulation prior to middle age.", "signif": "Pushes MND and CPF Board to adjust housing rules so singles don't drain their entire retirement fund just to buy a flat.", "why": "Single buyers face double the financial burden of dual-income couples.", "impact": "HIGH: Risk of elderly singles owning a home but having no cash for daily expenses, increasing reliance on schemes like the HDB Lease Buyback or Silver Housing Bonus.", "status": "Weak signal / Macroeconomic policy analysis.", "actors": "MND, CPF Board, Ministry of Manpower (MOM), single-earner households, aging single citizens.", "domain": "Economic / Political (STEEP) / CLC: Dynamic Urban Governance", "strength": "Weak", "source": "Wong, T. C., & Yap, A. (2003). From universal public housing to meeting the increasing aspiration for private housing in Singapore. Habitat International, 27(3), 361–380.\nRonald, R., Druta, O., & Godzik, M. (2018). Japan’s urban singles: negotiating alternatives to family households and standard housing pathways. Urban Geography, 39, 1018 - 1040. https://doi.org/10.1080/02723638.2018.1433924", "id": "GR10", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Ethnic Integration Policy (EIP) quotas creating housing resale price distortions.", "desc": "EIP ethnic quotas limit who can buy certain HDB resale flats. This creates price penalties for minority flat owners and inadvertently clusters lower-income households in specific estates.", "signif": "Pushes MND to consider income-based or flexible quota adjustments alongside race quotas by 2040.", "why": "Shows that race-based desegregation policies can unintentionally worsen income inequality and housing affordability.", "impact": "MED: Lower resale profits for minority sellers and reduced housing liquidity.", "status": "Weak signal / Empirical spatial analysis.", "actors": "MND, HDB, low-income citizens, ethnic minority flat owners, urban planners.", "domain": "Economic / Policy (STEEP) / CLC: Dynamic Urban Governance", "strength": "Weak", "source": "Tan, S. B. (2023). Do ethnic integration policies also improve socio-economic integration? A study of residential segregation in Singapore. Urban Studies, 60(4), 696–717.", "id": "GR11", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "HDB's age-35 restriction for singles unintentionally delaying marriage and family plans.", "desc": "Blocking singles under 35 from public housing forces young adults to live with parents longer. Research shows that lack of personal space and independence actually delays relationship formation, creating a policy contradiction.", "signif": "Challenges MND’s model of using housing restrictions to encourage marriage, forcing a rethink of housing access for adults aged 28–34 by 2040.", "why": "Proves that withholding public housing from young singles affects marriage and fertility rates.", "impact": "HIGH: Creates a massive wave of single applicants turning 35 who compete for 2-room flats, while causing housing frustration among young adults.", "status": "Weak signal / Academic evidence - growing sociological literature documenting state housing friction on singlehood.", "actors": "MND, Social Development Network (SDN, MSF) , unmarried citizens aged 25–35, educated single women, minority single demographics.", "domain": "Social / Political (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Strijbosch (2015), Journal of Marriage and Family; Raghunathan (2022), Sociological Research Online.", "id": "GR12", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Policy convergence of public and private housing tenure rights.", "desc": "Policy discourse and legislative reviews examine blurring the tenure boundary between HDB and private properties by relaxing rules on flat mortgaging, subletting, and estate management autonomy to give public lessees private-like property rights.", "signif": "Paves the way for hybrid public-private housing models by 2040, granting unmarried citizens and solo buyers greater commercial autonomy over public housing assets.", "why": "Acknowledges that rigid state controls over public housing lessees create friction as citizens demand greater asset flexibility and status parity with private property owners.", "impact": "HIGH: May expand private market mechanisms within HDB estates while forcing HDB to transition from a paternalistic landlord to a flexible property regulator.", "status": "Weak signal / Emerging policy intent - publicly noted in ministerial policy statements and housing studies.", "actors": "MND, HDB, commercial banks, public housing owners, private developers.", "domain": "Political / Legislative (STEEP) / CLC: Dynamic Urban Governance", "strength": "Weak", "source": "Wong, T. C., & Yap, A. (2003). Habitat International; Bocquet, D. (2015). Territorio, 74, 35–43.", "id": "GR13", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Emerging socio-spatial differentiation between private and public housing environments.", "desc": "Urban geography research demonstrates that state-led \"livability\" and selective upgrading projects have inadvertently deepened a class divide between high-end private/condominium \"cosmopolitans\" and suburban HDB \"heartlanders,\" generating citizen feelings of spatial exclusion and political patronage.", "signif": "Unmarried citizens and lower-to-middle-income singles feel structurally relegated to small 2-room Flexi units or priced out into resale markets, creating perceived \"second-class citizenship\" by 2040.", "why": "Exposes the social and political friction resulting from public housing policies that privilege nuclear family formation over single citizens' spatial aspirations.", "impact": "HIGH: Triggers public resentment over spatial equity, creates geographical class divides, and erodes trust in MND's inclusive master-planning and URA zoning framework, pressuring MND to introduce high-quality, centrally located public housing options for singles (e.g., Prime/Plus 2-room BTO flats).", "status": "Weak signal / Critical urban geography evidence.", "actors": "MND, URA, unmarried citizens, lower-middle income singles, urban planners.", "domain": "Social / Political (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Teo, S. (2014). Political tool or quality experience? Urban livability and the Singaporean state's global city aspirations. Urban Geography, 35(6), 916–937.", "id": "GR14", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Voluntary ethnic re-grouping and spatial clustering among majority Chinese buyers.", "desc": "Longitudinal analysis of planning area census data reveals that racial re-grouping and clustering in public housing occur primarily among the ethnic majority Chinese rather than minority populations. Planning areas with a high proportion of Chinese-quota-affected blocks attract a disproportionate inflow of Chinese buyers, maintaining or increasing majority concentration.", "signif": "Challenges the historical state assumption that ethnic enclaves are driven by minority groups, forcing MND to rethink EIP allocation rules to address majority-driven spatial concentration by 2040.", "why": "Shows that market-driven BTO/resale preferences naturally gravitate toward majority Chinese clustering, rendering the EIP less effective at preventing long-term majority spatial dominance.", "impact": "HIGH: Public housing estates in desirable central/mature zones face persistent upward price pressures and majority dominance, pricing out lower-income and minority buyers.", "status": "Weak signal / Quantitative demographic analysis.", "actors": "MND, HDB, Chinese majority buyers, ethnic minority home buyers.", "domain": "Social / Demographics (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Yap, Y. (2024). Racial residential patterns in Singapore: What happens after the implementation of racial quotas in public housing? Current Sociology, 72(5), 814–833.", "id": "GR15", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Housing price premiums for new immigrants decrease as they integrate socially.", "desc": "New immigrants pay higher rent due to lack of local market knowledge, but this price penalty decreases over time as they integrate and learn the local housing market.", "signif": "Shows that local community orientation reduces housing search frictions for new non-native residents.", "why": "Proves that initial rental price gaps are caused by lack of information rather than market discrimination.", "impact": "LOW: Faster financial parity between naturalized citizens and native buyers in the housing market.", "status": "Weak signal", "actors": "MND, HDB, People's Association, immigrant tenants, naturalized citizen buyers.", "domain": "Economic / Social (STEEP) / CLC: High Quality of Life", "strength": "Weak", "source": "Fan, Y., Teo, H. P., Tu, Y., & Wan, W. X. (2026). Social integration and housing behaviours of immigrants: Evidence from Singapore's public housing market. Cities, 175, 107220.", "id": "GR16", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Institutionalization of heteronormative family structures in the Constitution post-377A repeal.", "desc": "Following the 2022 repeal of Section 377A, the Singapore Parliament simultaneously amended the Constitution to protect the traditional definition of marriage (one man, one woman) from legal challenges, explicitly tying public housing allocation policies (e.g., BTO family schemes) to heteronormative family units.", "signif": "Formally locks single citizens, LGBTQ+ individuals, and non-traditional households out of mainstream public family housing schemes (BTO 3-room/4-room/5-room) until age 35, reinforcing a structural supply mismatch through 2040.", "why": "Demonstrates a state policy choice (\"calibrated social liberalization\") that grants private behavioral freedom while entrenching institutional exclusion in public resource distribution.", "impact": "HIGH: Forces expanding solo households and unmarried citizens into restricted 2-room Flexi BTO units or expensive private/resale markets, amplifying socio-economic strain.", "status": "Legislative amendment.", "actors": "MND, HDB, Parliament, unmarried citizens, single-person households, LGBTQ+ community.", "domain": "Legislative (STEEP)", "strength": "Happening now", "source": "Gao, D. (2025). Queer Singaporean futures after 377a: establishing homonormativity as concrete labour. Journal of Gender Studies, 34(3), 415–425; Abdullah, W. J. B. (2023). The Politics of Compromise: Analyzing the Repeal of Section 377A in Singapore. Pacific Affairs, 96(1), 105–118.", "id": "GR17", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Structural barriers driving Singapore's fertility decline that suppress family formation and reasons for not having children.", "desc": "High child-rearing costs (subsidies cover <33%), long HDB BTO wait times, work stress, and delayed marriage discourage Singaporeans from having children.", "signif": "Forces MND to shorten BTO wait times, provide flexible rental/micro-housing, and expand estate childcare to prevent demographic decline.", "why": "Shows that cash grants alone cannot fix birth rates without resolving core housing and workplace bottlenecks.", "impact": "HIGH: Rapid population aging, workforce contraction, and pressure on MND to unlink public housing eligibility from marriage.", "status": "Weak Signal / Emerging threat", "actors": "MND, HDB, NPTD (Talent division), MSF, young adults, employers", "domain": "Social / Economic (STEEP) / CLC: Dynamic Urban Governance", "strength": "Emerging", "source": "Chen, M.-N., Yip, P., & Yap, M. (2017). Identifying the most Influential Groups in Determining Singapore's Fertility. Journal of Social Policy, 47, 139 - 160. https://doi.org/10.1017/s0047279417000241\nKurowska, A., Matysiak, A., & Grabowska, M. (2026). Beyond Usual Suspects: Revisiting Barriers to Childbearing Decisions in a Low Fertility Setting. Population and Development Review, 52. https://doi.org/10.1111/padr.70046", "id": "GR18", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Friction in private condominiums due to expanding co-living tenancies.", "desc": "CNA TODAY reports condo residents (e.g., Parc Palais) raising concerns over co-living rentals causing facility crowding, security issues, and maintenance wear. MCSTs cannot ban these leases under BCA rules.", "signif": "future increase in alternative housing arrangements could require different approaches to regulation, spatial design and shared amenities.", "why": "Shows the limits of relying on private rentals to house singles when estate laws are built for traditional family owners.", "impact": "MED: Short-Term: Intensified competition for shared estate amenities (gyms, pools), rising security tracking concerns, and higher maintenance costs from frequent occupant turnover. Long-Term: Accelerates the need for MND/URA to establish standardized co-living regulations and expand state-backed flexible micro-housing models, as private condominiums face limits under existing strata laws.", "status": "Weak Signal", "actors": "MND, URA, BCA, Condo Management Councils, property owners, residents and tenants", "domain": "Legal / Policy (STEEP)", "strength": "Weak", "source": "Yeap, A. (2026, Sept 25). Can't live with co-living? Residents at one condo raise issues about security, crowding and maintenance. CNA TODAY", "id": "GR19", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Commodification of Flexible solo living", "desc": "According to Mordor Intelligence, institutional capital pools (e.g., CapitaLand, BlackRock, Warburg Pincus) are rapidly scaling private co-living and self-contained studio formats to capture working professionals seeking medium-term residential independence, achieving 85%–95% occupancy despite rising supply and premium pricing.", "signif": "Private capital fills pre-35 housing gap faster than public policy adaptions, creating socio-economic polarization between high-income singles and lower-income solo dwellers.", "why": "MND and HDB’s core urban governance model relies on public homeownership via 99-year leases. The rapid growth of co-living demonstrates a structural shift toward \"housing-as-a-service\" subscription models, where residents pay for flexibility rather than long-term asset accumulation.", "impact": "HIGH: If young Singaporeans increasingly rely on market-priced co-living and studio rentals for residential independence, they may spend less of their early working years building equity in a public flat or accumulating CPF Ordinary Account balances. By 2040, this could potentially weaken long-term financial security and add to retirement risks for some cohorts. This is a hypothesis for MND to monitor and test, as current evidence establishes market growth and occupancy rather than these longer-term effects.", "status": "Emerging", "actors": "MND, HDB, URA, Institutional Investors and Developers (e.g.,s CapitaLand), Commercial brand operators (e.g., Coliwoo)", "domain": "Economic (STEEP)", "strength": "Weak", "source": "Mordor Intelligence - Industrials & Services Practice. (2026, July 2). Singapore Co-Living Market Size & Share Analysis - Growth Trends and Forecast (2026 - 2031). Mordor Intelligence. https://www.mordorintelligence.com/industry-reports/singapore-co-living-market", "id": "GR20", "owner": "Grace", "log": "Singles & alternative housing"}, {"title": "Remote-capable vacancies are rising quickly", "desc": "MOM recently reported that remote-vapable job vacancies have grown from 14.4% in 2024 to 22.7% in 2025. This increase is rapid since remote-vacancies had declined from 35% in 2020 to 21% in 2022.", "signif": "If this trend continues upward, working-age residents may spend increasingly more weekday time near home rather than commuting away.", "why": "Such a labour-market change can alter the temporal geography of neighbourhood life more drastically than housing policy changes which often take years to take affect.", "impact": "MEDIUM: Could go in either direction; (1) More daytime footfall, local spending and attachment to the neighbourhood or (2)more private home-based lifestyles.", "status": "Recent one-year rise, but the overall forecast trajectory is uncertain given the drop in 2020-2023 before the recent uptick. Whether it persists or translates into actual remote work is uncertain.", "actors": "Workers, employers, local businesses, residents", "domain": "Economic (STEEP)", "strength": "Happening now", "source": "https://stats.mom.gov.sg/Pages/Job-Vacancies-2025.aspx?PageVersion=512", "id": "T1", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Co-living is as an alternative to the traditional housing journey of Singapore youth", "desc": "A co-living pilot was announced under the SG Youth Plan in August 2026, with more than 600 expressing interest for just a 100 units.", "signif": "Young adults may gain a new pathway to independence, weakening the assumption that family home → marriage → BTO is the only pathway.", "why": "Community elements are designed into co-living spaces, allowing tenants to mingle outside of private spaces. Co-living spaces also have dedicated social events and offer less restrictions than renting in HDB flats in terms of inviting guests.", "impact": "MEDIUM: Facilitates social interaction, making friends and promote strong sense of micro-communities, but these ties may be concentrated within the co-living development rather than the wider neighbourhood.Might eventually become an alternative to home ownership rather than just anoter rung on the housing ladder, spurring MND to reconsider the assumption that ownership and long residential tenure are the main foundations of neighbourhood rootedness.", "status": "Emerging policy and market option; still small relative to conventional homeownership.", "actors": "Young adults, parents, housing operators, URA, HDB, landlords.", "domain": "Social (STEEP)", "strength": "Emerging", "source": "https://www.channelnewsasia.com/singapore/co-living-youth-plan-rental-housing-policy-6328276", "id": "T2", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Nascent regional ethnic concentrations may be forming despite block-level mixing rules", "desc": "A 2026 RSIS study using 2016–2025 public-housing data examined evolving racial and permanent-resident spatial patterns, managing to identify emerging hotspots requiring attention.", "signif": "Even if individual blocks may comply with Ethnic Integration Policy (EIP) rules, ethnic gentrification is here to stay - many blocks have hit EIP racial quotas and have resulted in \"ethnic enclaves\" where different races are situated more in various parts of the country.", "why": "This is a Black Elephant because Singapore has a strong block-level integration mechanism, but larger-scale social mixing challenges may receive less attention.", "impact": "HIGH: Results show that Chinese buyers consistently favour HDB neighbourhoods in central locations, malay buyers favour far east/far west regions, while Indian buyers are scattered acorss the country other than central. A continued trend could create different lived experiences of diversity between towns; need for neutral social spaces and cross-neighbourhood mixing strategies.", "status": "Emerging longitudinal pattern rather than a settled outcome.", "actors": "Residents, HDB, policymakers, immigrant/PR households, community groups.", "domain": "Social (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "https://rsis.edu.sg/rsis-publication/scrp/tracking-ethnic-integration-policy-analysing-public-housing-patterns-among-immigrant-and-ethnic-groups-in-singapore/", "id": "T3", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Physical proximity alone may be insufficient to build social cohesion", "desc": "Recent Singapore research suggests that frequent encounters and physical proximity do not automatically translate into trust, mutual support or meaningful social ties. Spatial configuration, activity hubs and participation in local organisations appear to matter more than simply placing residents and facilities close together.", "signif": "MND's traditional emphasis on providing common spaces and nearby amenities may be insufficient if residents simply pass by one another without developing repeated or meaningful interaction.", "why": "The importance of common spaces is already widely recognised, but the gap between encounter and actual relationship-building is less visible and may be under-addressed.", "impact": "HIGH:This could shift community-building away from a focus on simply providing more physical spaces toward repeated shared activities and stronger local organisations that give people reasons to interact more than once. MND may have to allow more ground-up resident-led initiatives to increase rootedness and ownership.", "status": "Emerging information as government has allowed for more community events like holiday food giveaways, world cup screenings etc.", "actors": "Residents, HDB, policymakers, grassroots organizations", "domain": "Social (STEEP)", "strength": "Emerging", "source": "https://www.sciencedirect.com/science/article/pii/S0378873325000899", "id": "T4", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Physical AI is moving into shared urban space", "desc": "IMDA, JTC and SIT are launching Singapore's first mixed-use, multi-operator public-area testbed for autonomous robots in Punggol Digital District, including delivery, cleaning and security use cases.", "signif": "If such systems spread into HDB towns, everyday service encounters with mailman, cleaners and security personnel may become increasingly machine-mediated.", "why": "Residents may lose some of the small but recurring human encounters that currently occur with service workers in neighbourhood spaces. These interactions may seem insignificant individually, but for residents with limited social networks they can form part of their everyday social contact.", "impact": "LOW: Neighbourhood life could become more efficient but also more socially “contactless”, increasing social isolation and weaken familiarity within the neighbourhood for some. MND may have to rethink how to increase rootedness for these already-isolated individuals.", "status": "Real-world testbed launching in 2026; broad residential adoption is not established.", "actors": "Residents, IMDA, JTC, LTA, delivery and service firms.", "domain": "Technological (STEEP)", "strength": "Emerging", "source": "https://www.imda.gov.sg/resources/press-releases-factsheets-and-speeches/factsheets/2026/research-test-and-deploy-physical-ai-in-punggol-digital-district", "id": "T5", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Longer MOPs are creating policy-induced pockets of residential stability", "desc": "Under the new classification, Plus and Prime flats have a 10-year Minimum Occupation Period rather than five years, and whole-flat rental is not allowed.", "signif": "Future HDB estates may contain cohorts that remain owner-occupied for substantially longer before normal resale turnover is possible.", "why": "An important counter-signal to narratives of increasing transience - policy could create more stable resident cohorts. However, it is important to note that stability does not automatically create community and this is a perennial issue MND is working on.", "impact": "MEDIUM:Longer repeated exposure to the same neighbours allows stronger social memory to be formed.", "status": "New framework began with October 2024 launches; community effects will only be visible years later.", "actors": "Homeowners, HDB, prospective buyers.", "domain": "Political (STEEP)", "strength": "Emerging", "source": "https://www.hdb.gov.sg/buying-a-flat/bto-sbf-and-open-booking-of-flats/finding-a-new-flat/standard-plus-and-prime-housing-framework", "id": "T6", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "AI companions may reduce reliance on neighbourhood-based social connection", "desc": "A 2026 review on the “Connected Generation” warns that digital interaction can displace face-to-face relationships, especially through AI chatbots. They are increasingly being used for companionship and emotional support, particularly because they are constantly available, personalised and non-judgmental.", "signif": "Could change how social connectedness is formed - if residents increasingly turn to AI to meet some social and emotional needs, human interaction within their immediate neighbourhood may become less necessary for maintaining a sense of connection.", "why": "Challenges the assumption that providing common spaces, community programmes and opportunities for interaction will lead residents to seek neighbourhood-based relationships. MND may need to think more actively about what motivates residents to participate in local community life if future companionship can be obtained from within the home.", "impact": "HIGH: Could reduce residents' need for face-to-face interaction, leading to fewer neighbourhood ties and less connection to the estate. It could also lead to worsening of social skills and aggravate social isolation, in line with the 'Displacement Hypothesis'.", "status": "Black elephant - known to be a future issue but current policy directions are towards encouraging AI adoption rather than navigating AI's disruptions on social activity.", "actors": "Homeoweners, social service agencies, AI providers, local grassroots organizations", "domain": "Technological (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "https://premierscience.com/pjss-25-1058/", "id": "T7", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Digital convenience may be hollowing out the everyday interactions through which neighbourhood familiarity is built.", "desc": "Online purchasing among HDB households rose from 38.1% in 2018 to 58.2% in 2023/24. For categories such as household goods and clothing, substantial proportions of online buyers reported patronising HDB shops less often. Online grocery/market-produce purchasing also rose from 10.8% to 27.7%.", "signif": "The emerging issue is not convenience itself, but the possible disappearance of the repeated low-intensity encounters that historically accompanied everyday errands. Digital convenience allows residents to satisfy everyday needs without regularly visiting neighbourhood shops, markets or shared spaces.", "why": "These neighborhood spots historically serve as \"third places\"—spaces outside of home and work where neighbors naturally bump into each other, chat, and build community ties. If residents increasingly move directly between home, work and digitally mediated services, they may experence siloed living rather than a collective neighbourhood experience.", "impact": "HIGH: Could create a \"fortress home\" mindset, where the outside world—including the immediate neighborhood—is viewed as unnecessary to engage with.", "status": "Growing issue in Singapore but long-term effect on neighbourhood rootedness is still unknown.", "actors": "Local mom-and-pop stores,marts, groceries, residents", "domain": "Technological (STEEP)", "strength": "Happening now", "source": "https://www.hdb.gov.sg/hdb-pulse/news/2025/sample-household-survey-2023-24", "id": "T8", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Long-term construction disruption may suppress everyday neighbourhood social activity", "desc": "Large infrastructure and estate-renewal projects can expose nearby residents to prolonged noise, dust, blocked pathways and changing pedestrian routes. Evidence from residents living near the North-South Corridor suggests these disruptions can make everyday movement inconvenient.", "signif": "With more and more large-scale construction projects planned in the future in the bid to keep Singapore well-connected, this problem may continue to occur.", "why": "Neighbourhood rootedness depends partly on residents having comfortable reasons to leave their homes, walk around the estate and repeatedly encounter familiar people.", "impact": "MEDIUM: If construction makes outdoor areas noisy, dusty or inconvenient, residents may spend less time lingering in neighbourhood spaces even when those spaces are available. Decreased footfall at local shops, less use of nearby common spaces will weaken neighbourhood familiarity and social routines.", "status": "Emerging issue: We know construction creates noise and inconvenience, but the social consequence ( prolonged disruption of everyday life) — is much less known.", "actors": "LTA, residents, local stores, town planners", "domain": "Environmental (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "https://www.channelnewsasia.com/cna-insider/ground-up/north-south-corridor-expressway-residents-businesses-6170931", "id": "T9", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Digital-first neighbourhood communities are emerging before physical settlement", "desc": "Resident-run Telegram groups for BTO estates increasingly connect future neighbours before they physically move into their homes. Groups can contain hundreds or thousands of members and initially function as information hubs, but often evolve into channels for socialising, sharing items, group buys, gardening, childcare and organising physical activities after residents move in.", "signif": "Could redefine how neighbourhood rootedness forms, with community ties developing digitally even before residents physically move into an estate", "why": "Traditionally, neighbourhood ties would develop after people moved in, through repeated encounters in lifts, corridors, playgrounds or shops. These online digital communities challenge the narrative and shows that technology can be an enabler for social connection, contrary to mainstream thinking.", "impact": "HIGH:May allow new estates to develop social networks more quickly; could encourage estate-wide interest-based micro-communities and resident-led initiatives. This leads to a new form of 'kampung spirit' with deeper relationships built rather than just 'hi-bye' conversations. However, it could exclude those who are less digitally connected.", "status": "Growing trend: Such phenomenon may become more common as more Milennials and Gen Zs start to purchase housing", "actors": "Home owners, HDB, digital media platforms", "domain": "Technological (STEEP)", "strength": "Emerging", "source": "https://www.straitstimes.com/singapore/new-homeowners-find-kampong-spirit-on-bto-telegram-groups", "id": "T10", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Car-lite towns could convert road and parking space into social space", "desc": "URA's 2026 long-term planning work states that it is planning more town typologies with safer walk-cycle-ride environments. These will have less parking and more green/shared space.", "signif": "Thus could physically reallocate substantial neighbourhood space away from cars toward people, recreation and commerce. Tengah already has a car-free town-centre model where roads run underground to free-up space at the ground level.", "why": "Such people-centric design may create more opportunities for social interaction as all major facilities (sports hub, community hub, health facilities etc) are within easy reach, with residents not needing to venture out to meet daily needs.", "impact": "MEDIUM: More usable ground-level space, new gathering areas, changed retail footfall and mobility patterns. Improved walking and cycling experiences may spur more impropmtu converastions.", "status": "Early design direction and selected implementation, not yet the norm across HDB towns.", "actors": "Residents, URA, HDB, retailers", "domain": "Environmental (STEEP)", "strength": "Emerging issue", "source": "https://www.ura.gov.sg/land-planning/long-term-plan/public-engagement-journey/themes/future-of-mobility/planning-roads-and-town-typologies/", "id": "T11", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Rising commercial rents may accelerate the turnover of long-standing heartland shops", "desc": "Commercial rent pressures are making it harder for some long-standing heartland shops and food stalls to remain viable.Older neighbourhood businesses are increasingly being replaced by newer F&B concepts, lifestyle businesses and chain outlets. Moreover, many heartland stallholders are closing because of higher rents and operating costs.", "signif": "Could change the social character and identity of HDB neighbourhoods if familiar local businesses are replaced more frequently by newer more standardised commercial offerings.", "why": "MND may lose an important but informal source of neighbourhood familiarity and social connection.", "impact": "MEDIUM:Residents may lose familiar shopkeepers, regular customers and routines that contribute to a neighbourhood feeling like “home”. However, newer businesses may become new social anchors and attract younger residents.", "status": "Currently happening and has been an issue for many years.", "actors": "Heaartland shopkeepers, newer retailers, residents", "domain": "Economic (STEEP)", "strength": "Happening now", "source": "(1) https://www.channelnewsasia.com/singapore/sg-heartland-coffee-shop-hawker-rental-overheads-stallholders-quit-high-costs-4059986\n(2) https://www.channelnewsasia.com/cna-insider/big-read/remote-work-big-firms-hardline-stance-4715421", "id": "T12", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Estate relocation may disrupt — but also reshape — residents’ place attachment", "desc": "A study of residents affected by SERS in Tanglin Halt found that relocation can disrupt familiar social networks, routines and neighbourhood spaces. However, residents can rebuild a sense of home by maintaining familiar relationships and recreating routines in their new environment.", "signif": "Could redefine rootedness as something that can be disrupted, transferred and rebuilt across places rather than being permanently tied to one physical estate. This becomes increasingly important as older HDB estates undergo renewal and residents are relocated.", "why": "Challenges the assumption that providing replacement housing — even nearby — is sufficient to preserve residents’ sense of home and belonging. Urban renewal may need to consider continuity of social networks, familiar activity spaces and residents’ agency alongside physical rehousing.", "impact": "HIGH: Given the rise in mature estates that might be nearing the end of their leases by 2040, the government will have to more critically think with regards to relocation, beyond just physical rehousing.", "status": "Emerging as only 4% of HDB stock is covered by VERS, whereas the balance will be covered by VERS (which has been announed and not been implemented yet)", "actors": "Residents affected by redevelopment, grassroots roganizations", "domain": "Social (STEEP)", "strength": "Emerging", "source": "https://www.sciencedirect.com/science/article/pii/S0264275124000763#s0085", "id": "T13", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Increasing regulation of common spaces may reduce spontaneous community life", "desc": "Complaints over noise and nuisance have led some town councils to remove seating, restrict activities or temporarily close HDB common spaces such as void decks and recreational areas.", "signif": "Could shift HDB common spaces from flexible, resident-shaped environments towards more controlled and regulated spaces, changing how spontaneous neighbourhood life develops.", "why": "Highlights a tension between creating peaceful enviroments and preserving the resident-led use of common spaces that brings together the neighbourhood identity. MND needs to find the right balance to still ensure residents develop a sense of ownership over their neighbourhood.", "impact": "MEDIUM:Massive restrictions could result in residents losing their sense of 'personal freedom', while insufficient regulation could also create noise and conflict, undermining attachment to estates.", "status": "Already observable but still localised and episodic. Between 2021 and 2023, there were 27 cases where town councils temporarily closed or restricted the use of HDB recreational facilities following complaints such as noise.", "actors": "Children, residents, grassroots organizations", "domain": "Environmental (STEEP)", "strength": "Emerging", "source": "(1) https://www.channelnewsasia.com/cna-insider/big-read/big-read-in-short-hdb-void-decks-social-bonding-spaces-or-pain-points-residents-5883311\n(2) https://www.channelnewsasia.com/cna-insider/big-read/urban-spaces-design-architecture-restrict-nudge-behaviours-5893441", "id": "T14", "owner": "Taher", "log": "Neighbourhood rootedness"}, {"title": "Integrated community hubs are becoming a deliberate tool for social mixing", "desc": "Singapore is increasingly co-locating community, sports, healthcare, retail and civic facilities within integrated hubs such as Our Tampines Hub and Heartbeat@Bedok.", "signif": "Could shift town planning from merely providing amenities near homes towards deliberately designing places that bring different age, income and household groups into repeated contact.", "why": "Such a calibrated policy approach ensures that the onus is not only on us residents to form social connections and rootedness, but the government is trying to catalyse such an outcome through spatial policy design.", "impact": "MEDIUM: Could create stronger town-level social hubs by increasing cross-generational and cross-group interaction opportunities. This is especailly important given an ageing population, where having community hubs ensure accessibility of amenities for elderly.", "status": "Already implemented in established hubs, with many new hubs planned over the next decades.", "actors": "MND,URA,SportSG,
