<style>
/* Layout: sticky header + scrollable tab rail; single reading column (max 1100px) with cards only where an object needs edges. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --ink:#18222b; --muted:#56636e; --line:#d5dcd9;
  --accent:#0d6f62; --accent-ink:#ffffff; --accent-soft:#d8ece8; --warn:#a8481a; --warn-soft:#f6e3d8;
  --loopR:#2a78d6; --loopB:#c4561f; --pos:#2f5f8a; --neg:#b3401e;
  --d5:#1b7f52; --d4:#5aa77b; --d3:#8f979c; --d2:#d98c5c; --d1:#bf3f2b;
  --font-display:"Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111619; --surface:#192024; --surface-2:#222b30; --ink:#e4eaed; --muted:#9ba8b0; --line:#2e383e;
  --accent:#43b6a3; --accent-ink:#06211d; --accent-soft:#173430; --warn:#e58a5c; --warn-soft:#3a241a;
  --loopR:#5b9ae8; --loopB:#e07a45; --pos:#7fb0de; --neg:#ef8a6a;
  --d5:#36a873; --d4:#6fbf92; --d3:#8a949a; --d2:#df9a6e; --d1:#e0624d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111619; --surface:#192024; --surface-2:#222b30; --ink:#e4eaed; --muted:#9ba8b0; --line:#2e383e;
  --accent:#43b6a3; --accent-ink:#06211d; --accent-soft:#173430; --warn:#e58a5c; --warn-soft:#3a241a;
  --loopR:#5b9ae8; --loopB:#e07a45; --pos:#7fb0de; --neg:#ef8a6a;
  --d5:#36a873; --d4:#6fbf92; --d3:#8a949a; --d2:#df9a6e; --d1:#e0624d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand h1{font-size:1.2rem}
.brand .sub{color:var(--muted);font-size:.85rem}
.status{margin-left:auto;font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--d3);display:inline-block}
.dot.on{background:var(--accent)} .dot.warn{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding-bottom:0}
nav.tabs button{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 .92rem var(--font-display);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 60px}
section.view{display:grid;gap:18px}
.lede{color:var(--muted);max-width:68ch;margin:4px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 220px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;max-width:100%;overflow-wrap:anywhere;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink);}
.pill.acc{background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft)}
.num{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);letter-spacing:.02em}
button,.btn{font:600 .9rem var(--font-body);border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;cursor:pointer;min-height:36px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
button.on{background:var(--accent-soft);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:72px;resize:vertical}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f select,label.f input[type=text]{width:100%}
.row>*{min-width:0}
select{max-width:100%}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);font-size:.9rem}
.banner.info{background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font:700 1.5rem var(--font-display)}
.stat span{font-size:.8rem;color:var(--muted)}
.drv{display:grid;gap:8px}
.drv-head{display:flex;gap:10px;align-items:flex-start}
.drv-head .t{flex:1;min-width:0}
.drv-head h3{font-size:1.05rem}
.drv.short{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
details>summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.88rem;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";} details[open]>summary::before{content:"▾ ";}
.note{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.note .who{font-size:.78rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.note .who img{width:18px;height:18px;border-radius:50%}
.src{font-size:.85rem;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.subtabs button{flex:0 0 auto;font-size:.82rem;min-height:32px;padding:5px 10px}
.scorecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.score{display:flex;gap:12px;align-items:baseline}
.score b{font:700 2rem var(--font-display);font-variant-numeric:tabular-nums}
svg text{font-family:var(--font-body)}
.wheel-svg{width:100%;min-width:640px;height:auto;display:block}
.cld-svg{display:block}
.matrix-svg{width:100%;height:auto;display:block;max-width:720px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;min-height:34px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.quad{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:auto auto auto;gap:8px}
.quad .ylab{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);text-align:center}
.quad .xlab{grid-column:2/4;display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.qcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px;display:grid;gap:8px;min-width:0;border-top:6px solid var(--d3)}
.qcard input.qname{font:700 1rem var(--font-display);width:100%}
.desir{display:inline-flex;align-items:center;gap:6px;font-size:.8rem}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
.loop{border-left:4px solid var(--loopR);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;cursor:pointer}
.loop.B{border-left-color:var(--loopB)}
.loop.sel{outline:2px solid var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.outline li{margin:4px 0} .outline ul{margin:2px 0 6px;padding-left:20px}
.tagsel{font-size:.75rem;padding:2px 4px}
@media (max-width:760px){.two{grid-template-columns:1fr}.quad{grid-template-columns:20px 1fr}.quad .xlab{grid-column:2}.quad .ylab{grid-row:auto}.quad>.qcard{grid-column:2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
