instream press.", "actors": "NUS researchers, MND, HDB, high-wealth families.", "domain": "Economic (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "Agarwal, Fan, Qian & Sing (2023), WID.world WP 2023/16 - https://wid.world/document/like-father-like-son-social-engineering-and-intergenerational-mobility-in-housing-consumption-wid-world-working-paper-2023-16/", "id": "Y1", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Limited Mobility at the bottom to Rise", "desc": "Children of bottom 50-80% (HDB) parents show only 0.06-0.11 persistence; BTO access lifts mobility ~11pp.", "signif": "[High] Shows the one lever that demonstrably works, but only partially.", "why": "Proves public housing still delivers real (if capped) mobility.", "impact": "If BTO supply/access tightens, this mobility channel narrows.", "status": "Published academic working paper; not mainstream press.", "actors": "HDB, lower/middle-income households.", "domain": "Economic (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "Agarwal, Fan, Qian & Sing (2023), WID.world WP 2023/16 - https://wid.world/document/like-father-like-son-social-engineering-and-intergenerational-mobility-in-housing-consumption-wid-world-working-paper-2023-16/", "id": "Y2", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Built-In Price Transmission: Subsidised and Market Prices Move Together", "desc": "New BTO prices were formulaically set at a 20% discount to prevailing resale prices, so resale rises mechanically pulled new 'subsidised' prices up too - Chua names this explicitly a 'vicious cycle of price inflation.' Delinked in 2011.", "signif": "[High] Shows government itself identified and tried to cut this transmission channel.", "why": "Resolves how HDB pricing affects the broader market - via formula, not simple suppression.", "impact": "If the delinking didn't fully work, a hidden channel may still be transmitting wealth concentration today.", "status": "Historical mechanism (pre-2011); rarely cited in current 'decoupling' debate.", "actors": "MND, HDB, all HDB owners 1990s-2011.", "domain": "Legislative (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "Chua (2014), Housing Studies 29(4) - https://doi.org/10.1080/02673037.2013.874548", "id": "Y3", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Stratification Inside Public Housing Itself", "desc": "HDB prices premium, central BTO projects (Pinnacle@Duxton, Dawson) via 'consumer preference pricing' - e.g. Clementi 4-room BTO ~1.77x a Punggol 4-room BTO.", "signif": "[Medium] A prime/sub-prime geography is forming within subsidised housing, not just HDB-vs-private.", "why": "Adds a second stratification axis the problem statement doesn't currently cover.", "impact": "Even successful BTO applicants face unequal asset-appreciation prospects by location.", "status": "Case-study academic analysis; data runs 2004-2015.", "actors": "HDB, 'sandwiched' middle-income applicants.", "domain": "Political (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "Teo (2015), Geoforum 65 - https://doi.org/10.1016/j.geoforum.2015.08.003", "id": "Y4", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Transit Infrastructure as an Independent Wealth Channel", "desc": "Downtown Line raised nearby property values 4.84% over 4 years, concentrated in high-income areas; welfare gains 1.8% (high-income) vs ~0.1% (low-income).", "signif": "[Medium] Shows housing-wealth stratification is reinforced by non-housing policy (transport planning).", "why": "Broadens the mechanism beyond CPF/HDB policy alone - relevant if MRT expansion continues to 2035.", "impact": "Future transit lines could replicate this effect unless routed/priced deliberately.", "status": "Published in a top economics journal, 2026.", "actors": "LTA, URA, high- vs low-income commuters/residents.", "domain": "Economic (STEEP)", "strength": "Strong", "source": "Lee & Tan (2026), Rev. Econ. Stat. 108(4) - https://doi.org/10.1162/rest_a_01442", "id": "Y5", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "The Wealth Gap Made Official: Gini 0.55", "desc": "Wealth Gini 0.55 (vs income Gini 0.38); top 5% hold 33% of wealth, top 1% hold 14%.", "signif": "[High] Authoritative baseline to track housing-driven stratification against.", "why": "Housing is the dominant store of wealth, so this is the clearest outcome metric available.", "impact": "Likely to increase political pressure for redistribution measures.", "status": "Officially confirmed in Parliament, first-ever release.", "actors": "MOF, Parliament, all households.", "domain": "Economic (STEEP)", "strength": "Strong", "source": "Malay Mail, 25 Feb 2026 - https://www.malaymail.com/news/singapore/2026/02/25/singapore-publishes-wealth-data-for-first-time-finance-ministry-finds-richest-1pc-own-14pc-of-assets/210401", "id": "Y6", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Income Polarisation", "desc": "Real household income +18.0% (bottom decile) vs +52.3%/+50.9% (top two deciles), 2001-2023.", "signif": "[Medium] Income inequality compounding wealth inequality over the same horizon.", "why": "Shows the gap isn't just a housing story - income growth itself is diverging.", "impact": "Without correction, income gaps will keep feeding the housing-wealth gap.", "status": "Cited in peer-reviewed paper, sourced from SingStat.", "actors": "Dept of Statistics, all resident households.", "domain": "Economic (STEEP)", "strength": "Strong", "source": "Lee & Tan (2026), citing SingStat (2024)\nhttps://doi-org.libproxy.smu.edu.sg/10.1162/rest_a_01442", "id": "Y7", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Housing's Dominant (and Disputed) Asset Share", "desc": "Residential property = 43.9% of household assets (SingStat Q2 2025); 'about half' per NUS commentary.", "signif": "[High] Establishes the structural scale of housing's role in total wealth.", "why": "The load-bearing fact behind the entire problem statement.", "impact": "A lower, verified share is still dominant - but the exact number matters for credibility.", "status": "Official, recurring quarterly release.", "actors": "Dept of Statistics, MAS, all households.", "domain": "Economic (STEEP)", "strength": "Strong", "source": "SingStat Q2 2025 - https://www.singstat.gov.sg/-/media/files/news/hh_bal2q2025.ashx", "id": "Y8", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Historical Price Run-Up in Subsidised Housing", "desc": "New 4-room BTO in Sengkang: ~$132k-210k (2006) to ~$246k-337k (2011), a 70% rise in 5 years vs ~4%/yr inflation.", "signif": "[Low] Concrete historical magnitude showing prices outpacing income even in 'subsidised' flats.", "why": "Grounds the problem statement in hard numbers, not just recent trend lines.", "impact": "If repeated, 2035 BTO prices could outpace income growth by a similar multiple.", "status": "Historical data point (2006-2011); not updated since.", "actors": "HDB, first-time buyers of that era.", "domain": "Economic (STEEP)", "strength": "Weak", "source": "Chua (2014), Housing Studies 29(4) - https://doi.org/10.1080/02673037.2013.874548", "id": "Y9", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Racing In Early: The Falling Age of Private Ownership", "desc": "Under-35 share of new private buyers rose 9%->35% (2015-23); median buyer age fell 45->39.", "signif": "[Medium] Signals a generational shift to earlier private-market entry as an investment strategy.", "why": "Directly measurable evidence the 'early entry' pathway is already happening.", "impact": "Raises household leverage risk if driven by debt rather than family equity.", "status": "Industry white paper, not yet peer-reviewed.", "actors": "MAS, developers, young buyers, parents, banks.", "domain": "Economic (STEEP)", "strength": "Emerging", "source": "ERA Realty / Malay Mail, 27 Jan 2024 - https://www.malaymail.com/news/singapore/2024/01/27/buying-condos-before-35-report-finds-young-singaporeans-make-up-growing-share-of-new-private-property-buyers/114827", "id": "Y10", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "The Wealth-Building Script: Aspiration Meets a Lease Ceiling", "desc": "83% of Singapore youth see owning property (public or private) as important to achieve in their lifetime and most plan to upgrade; 78% specifically aspire to private ownership as a life goal; 70% doubt their own children will afford homes (TODAY Youth Survey, 2023).", "signif": "[Medium] Shows demand pressure will likely persist even as affordability confidence erodes.", "why": "Direct survey evidence for the demand-side half of the problem statement; professor flagged this as a strong signal (2026-10).", "impact": "Sustained demand for private property as a status marker could keep prices elevated.", "status": "Survey-confirmed; recurring annual media theme.", "actors": "Youth 18-35, parents, MND.", "domain": "Social (STEEP)", "strength": "Happening now", "source": "TODAY Youth Survey, 18 Oct 2023 - https://www.malaymail.com/news/singapore/2023/10/18/today-youth-survey-78pc-of-singapore-youth-aspire-to-own-private-homes-as-life-goal-experts-say-financial-realities-will-temper-expectations/96910", "id": "Y11", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "The Same Gap, Measured Two Decades Earlier", "desc": "In 2002, 38.9% of HDB owners already 'dreamed' of private housing, overwhelmingly blocked by affordability, not preference.", "signif": "[Low] Proves the aspiration-affordability gap is multi-decade and structural, not a recent phenomenon.", "why": "Gives the 2023 survey historical depth and credibility.", "impact": "Suggests two decades of policy effort haven't closed this specific gap.", "status": "Peer-reviewed survey research (90 HDB + 60 private households).", "actors": "HDB owners, private owners, HDB, URA.", "domain": "Social (STEEP)", "strength": "Black Jellyfish (Unknown Known)", "source": "Wong & Yap (2003), Habitat Int'l 27(3) - https://doi.org/10.1016/S0197-3975(02)00062-0", "id": "Y12", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Income Polarisation at the Turn of the 2000s", "desc": "Share of households earning S$10,000+/month rose from 2.8% to 10.3% in a decade (1990-2000).", "signif": "[Low] Early marker of the same income/wealth divergence visible today.", "why": "The problem has a 30+ year run-up, not a sudden onset.", "impact": "Reinforces that today's stratification is the mature stage of a long trend.", "status": "Historical census data, well-documented at the time.", "actors": "Dept of Statistics, all households.", "domain": "Economic (STEEP)", "strength": "Weak", "source": "Wong & Yap (2003), Habitat Int'l 27(3) - https://doi.org/10.1016/S0197-3975(02)00062-0", "id": "Y13", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "CPF-Funded Ownership Creates 'Asset-Rich, Cash-Poor' Retirees", "desc": "Heavy pre-retirement CPF withdrawal for housing depletes retirement savings even as flat values rise.", "signif": "[Medium] Links housing-wealth concentration to a parallel retirement-adequacy crisis by 2035.", "why": "Shows housing wealth isn't freely transferable, instead much of it is retirement-locked.", "impact": "Future retirees may need to liquidate/downsize, affecting what's passed to children.", "status": "Origin of Singapore's 'asset-based social security' policy framing, 2000s.", "actors": "CPF Board, retirees, adult children.", "domain": "Economic (STEEP)", "strength": "Black Elephant (Known Unknown)", "source": "Chua (2014), Housing Studies 29(4) - https://doi.org/10.1080/02673037.2013.874548", "id": "Y14", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Housing Affordability as a Proven Electoral Flashpoint", "desc": "The 2011 General Election, fought substantially on housing affordability, delivered the ruling party's worst result since 1959.", "signif": "[Low] Demonstrates housing-wealth stress has real, documented political consequences.", "why": "Not just an economical issue. Posesses real risk to political legitimacy", "impact": "A repeat scenario by 2035 could force faster or more disruptive policy intervention.", "status": "Well-documented historical event.", "actors": "PAP, opposition parties, all voters.", "domain": "Political (STEEP)", "strength": "Strong", "source": "Chua (2014), Housing Studies 29(4) - https://doi.org/10.1080/02673037.2013.874548", "id": "Y15", "owner": "Yan Lyn", "log": "Housing wealth & stratification"}, {"title": "Rising elderly isolation in HDB estates", "desc": "Older Singaporeans living alone are increasingly socially disconnected, with limited community touchpoints post-retirement.", "signif": "Could redefine the role of community spaces and social infrastructure in public housing policy.", "why": "Aligns with SG Green Plan's Resilient Future pillar; challenges current 'ageing-in-place' policy assumptions.", "impact": "May drive demand for new public service delivery models; risk of increased healthcare burden.", "status": "Weak signal — emerging in community press; limited academic literature; 2 government reviews underway.", "actors": "MOH, HDB, Silver Generation Office, grassroots organisations, informal caregivers.", "domain": "CLC: High Quality of Life", "strength": "Weak", "source": "Straits Times (2025), MOH Policy Brief (2024), Scopus: Journal of Ageing & Society", "id": "H1", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Change in biodiversity and ecological value and importance to Singapore's native biodiversity", "desc": "When deciding to designate an area as a Nature Reserve, its biodiversity and ecological value and its importance to Singapore's native biodiversity is considered.", "signif": "Could have an impact of the size of the nature reserve, depending on the flora and fauna.", "why": "Important as these are the factors that are weighed against Singapore's other land-use needs like housing.", "impact": "Fewer nature reserves when the demographic of flora and fauna change, reducing the ecological value and importance to Singapore's native biodiversity.", "status": "Weak Signal -- Emerging in considerations of land-use decisions", "actors": "Nparks, MND, environmental groups, residents", "domain": "Environmental (STEEP)", "strength": "Weak", "source": "NIH (2023)", "id": "H2", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Resident and nature groups forming coalitions to challenge developments around green spaces, increased advocacy for green spaces", "desc": "There has been a rise in community coalitions calling for more studies to be done on the surrounding environment where works are being carried out, such as works for Lorong Halus Bus Deport", "signif": "Could increase pressure on the government to do more studies to ensure that the environment is protected; could result in stricter policies after.", "why": "Places pressure on the government, which could change their stance on the demolishment of green spaces. Residents are also taking a more role in protecting nature.", "impact": "Fewer green spaces as more care and planning required, which will come at a monetary cost and space cannot be used for other purposes.", "status": "Emerging - Fewer homes are planned for Maju Forest and Gilman Barracks after public feedback, highlighting the power public voice has in the conservation of green spaces and presence of public advocacy for it.", "actors": "Residents, nature groups, NGOS, developers, MPs", "domain": "Environmental (STEEP)", "strength": "Emerging", "source": "Straits Times (2026)", "id": "H3", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Recognition of the \"Ecological Premium of established greenery\"", "desc": "Mature greenery may have ecological value that cannot be replicated by planting new trees", "signif": "Could shift future planning from replacing removed greenery and creating new ones to prioritization of retaining of exisiting mature ecosystems", "why": "Challenges the assumption that the environmental effects will be the same through replanting.", "impact": "More green spaces to be planned around mature greenery rather than greenery being planned around other develoments.", "status": "Weak Signal - Currently, research is being done to identify how different green spaces function ecologically in Singapore but there is limited research in specifically mature greenery.", "actors": "MND, Nparks, experts, policymakers", "domain": "Environmental (STEEP)", "strength": "Weak", "source": "Straits Times (2026)", "id": "H4", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Prioritization of green spaces based on their regional functions", "desc": "Green areas could be assessed based on their contributions to the broader area around it.", "signif": "Could lead to land allocation decisions that consider the role of individual green spaces within wider ecological networks rather than evaluating them in isolation.", "why": "May provide benefits to its immediate surroundings and beyond, such as cooling and flood mitigation.", "impact": "More research is required to be done to make any changes to existing greenery but the environment and people may potentially benefit from this increased research", "status": "Weak Singal - There are calls to retain Serangoon Garden River to mitigate any heat impact from the future town", "actors": "URA, Nparks, MND", "domain": "Environmental (STEEP)", "strength": "Weak", "source": "Straits Times (2026)", "id": "H5", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Retention of vegtation within planned estates.", "desc": "Shift away from focus of building first before creating green spaces, to building of housing around green spaces", "signif": "Could change planning in the future, and influence the design of future housing plans", "why": "Suggests that there is a possibility of housing and green spaces being planned together rather than separately.", "impact": "Could show move toward increased transparency and adjusted developmental decisions in response to environmental assessments and expert input.", "status": "Happening Now - Feedback from experts regarding impact on heritage and environment by construction of houses are taken into account.", "actors": "MND, HDB, Nparks, residents,", "domain": "Environmental (STEEP)", "strength": "Happening now", "source": "Straits Times (2026)", "id": "H6", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Growing preferences for home near nature", "desc": "Proximity to nature can be presented as a factor that residents can consider when deciding whether to purchase a flat", "signif": "By recognising this as an official factor, it may give families or individuals a new reason to choose housing.", "why": "Government officials may need to incorporate or preserve nature spaces near housing if there is proven to be a demand.", "impact": "Green spaces may be planned in tandem with housing planning to better suit the changing demands of Singaporeans.", "status": "Emerging Signal - While proximity to green spaces is one of the considerations, it is currently not commonly a priority among those looking to purchase a home.", "actors": "MND, HDB, Prospective Homeowners", "domain": "Social (STEEP)", "strength": "Emerging", "source": "Straits Times (2026)", "id": "H7", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Recognition of connection between green spaces and culture", "desc": "Green spaces leave behind cultural footprints for most Singaporeans especially the pioneer generation.", "signif": "Increase in preservation of historically significant iconic green spaces.", "why": "These green spaces can play a role in forging national identity among young Singaporeans and act as a bridge to birng the older and younger generation together.", "impact": "More green spaces to be recognised as historical sites and can be officially protected as a culturally significant location.", "status": "Weak Signal - A 2015 study found that cultural ecosystem services include sense of place and cultural heriatage. Yet it found that these spaces are not officially protected.", "actors": "MND, Nparks, Residents, Businesses, Tourists, Government", "domain": "Environmental (STEEP)", "strength": "Weak", "source": "CAN Today (2015), NIH (2015)", "id": "H8", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Competing land-use needs with housing as a result of limited land", "desc": "Limited land space in Singapore creates competition between infrastructure, industry and green-space conservation", "signif": "More analysis and weighing between land usage may be done when considering green spaces, hence resulting in smaller or fewer green spaces", "why": "Green spaces that generally do not generate as much economic profit or present tangible benefits to residents may take a back seat in view of current green space measures.", "impact": "Fewer green spaces as land is needed to build housing and other infrastructural needs.", "status": "Strong Singal - It has been acknowledged by the government in several conferences but cannot be avoided.", "actors": "Members of Parliament, MND, Nparks, Residents", "domain": "Environmental (STEEP)", "strength": "Strong", "source": "Straits Times (2026)", "id": "H9", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Demand for diversification of nature-based recreational spaces", "desc": "Residents may increasingly seek different types of nature-based experiences beyond walking, wildlife obersvation and social activities.", "signif": "Future green spaces may need to cater in increasingly diversified demands and needs of residents.", "why": "By diversifying the use of green spaces, there is more justification for its presence and people may increaingly appreciate it more due to increased access and use for it.", "impact": "Greater variety of facilities within green spaces which can allow for more varied activities.", "status": "Happening now - There are reports that 13 parks in Singapore will be enhanced with curated themed trails to expand nature-based recreation. Currently there is a proposal for an evolving gardening and lifestyle hub.", "actors": "MND, Nparks, Residents", "domain": "Environmental (STEEP)", "strength": "Happening now", "source": "Straits Times (2023), conversations with neutral third party", "id": "H10", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Restoration of ecosystem habitats", "desc": "Action can be taken to restore , improve or maintain their ecological function and their benefits to the environment.", "signif": "More flora and fauna to return to these restored green spaces, bringing about benefits for the enviornment, people and potentially research", "why": "Previously damaged or unused spaces can be developed into usable green spaces rather than being left unattended to", "impact": "Increase in the number of green spaces as restoration creates more green spaces and maintains current ones", "status": "Happening now - Currently happening as part of Singapore's 2030 Green Plan, (City in Nature)", "actors": "Nparls, MND, NGOs, Researchers, Environmental experts", "domain": "Singapore Green Plan: City in Nature", "strength": "Happening now", "source": "National Parks (N.d.)", "id": "H11", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Tackling climate change with biodiversity", "desc": "Biodiversity conservation and climate change are interlinked and must be viewed together, leading to greater consideration of how green spaces can simultaneously support biodiversity and climate resistance", "signif": "Heavier significance could be placed in the planning of green spaces as it concerns the legitimacy of Singapore's branding and environmental impact.", "why": "May be detrimental to Singapore's brand as a City in Nature or Garden City, reducing overall appeal in this aspect. May also result in loss of diversity and decrease well being of residents as a result of the consequences of climate change such as increasingly hot and unpredicatable weather", "impact": "More carefully planned green spaces to protect the diversity of flora and fauna in Singapore, and to bring out the most tangible environmental benefits to residents.", "status": "Emerging - Present research links biodiversity with ecosystems services with adaptions to urban heat and inland flooding. This is complemented by initiatives such as the OneMillionTrees movement to involve the community in planting trees", "actors": "Reseachers, MND, Nparks, NGOs", "domain": "Environmental (STEEP)", "strength": "Emerging", "source": "Ministry of National Development (MND),", "id": "H12", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Mismatch between ecosystem services from the natural landscape and demand from urban dweller", "desc": "Ecosystems may not be able to sufficiently provide what humans demand for such as sustenance, safety, health and comfort.", "signif": "Due to their unpredictable nature in a way that humans cannot exactly control, there is no confirmation or definite answer to how much they can provide for humans. It may change the approach that people take towards nature as rather than solely thinking about what it can provide, mindsets can be changed to think more about what humans can do to help nature provide for humans and more.", "why": "This mismatch results in decrease in demand and need for green spaces since they are unable to benefit humans.", "impact": "Fewer green spaces as not only do they have the potential produce less benefit, they have the potential to cause harm.", "status": "Weak - A survey found that vegetation types are not perceived equally in the ecosystem services and disservices they provide.", "actors": "Businesses, MND, Nparks, Residents, MPs, researchers, residents", "domain": "Environmental (STEEP)", "strength": "Weak", "source": "ResearchGate (2022), MDPI (2020)", "id": "H13", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Economic shift from land-sales revenue to ecosystem cost avoidance", "desc": "When analysing the economic benefits for land use, researchers can focus more on the economic gain from avoiding certain costs as a result of green spaces rather than valuing the cost of the land itself.", "signif": "This could change the way that green spaces are looked at economically which then changes the benefits that it can produce.", "why": "By changing the framing of economic value of green spaces, a more even cost-benefit analysis can be conducted when analysing allocations of land for green spaces.", "impact": "Potentially more benefit from different aspects of green spaces being identified, where economic analysis can emerge from.", "status": "Weak - URA and MND are using advanced digital and monitoring systems alongside centralized ecosystem mapping systems to evaluate ecological trade-offs, but these are not monetized yet and official plot value is still based on real estate development potential and revenue rather than the cost it can subtract", "actors": "Research, MND, Nparks, Economists, URA", "domain": "Economic (STEEP)", "strength": "Weak", "source": "URA (n.d.)", "id": "H14", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Demand for community participation in green-space design", "desc": "Having a stake in the creation of green spaces may allow residents to feel more connected to these spaces, increasing their demand for it.", "signif": "Taking reference from HDB ownership giving Singaporeans a stake in Singapore's creation and identity building, co-creation can allow for Singaporeans to feel an increasing connection to green spaces, increasing demand and advocacy for it.", "why": "By giving citizens a voice and choice in how they can better use green spaces, green spaces can be better adapted to suit their needs, changing the way green spaces are planned.", "impact": "More functional green spaces may increase its land allocation as there is more use for it beyond its ecological benefits. Increased community ownership and advocacy in terms of the community", "status": "Weak - Happening in selected projects e.g. Nparks' Friends of the Parks design process, but not a compulsory requirement", "actors": "MND, Nparks, residents, Researchers, NGOs, Educational Insitutions, GRCs", "domain": "Social (STEEP)", "strength": "Weak", "source": "Conversations with neutral third party, Nparks (2025)", "id": "H15", "owner": "Hannah", "log": "Green spaces 2040"}, {"title": "Rising elderly population with dementia", "desc": "Number of elderly with dementia projected to increase to 152,000 by 2030.", "signif": "Housing must be adapted accomadate for the increased demands of dementia patients", "why": "Directly shapes HDB policy on ageing-in-place and long-term care financing.", "impact": "High impact - May drive demand for more dementia-friendly housing", "status": "Strong signal — official MOH projection", "actors": "MOH, HDB, MND, Agency for Integrated Care, IMH, informal caregivers, elderly residents.", "domain": "CLC: High Quality of Life", "strength": "Strong", "source": "Dementia Singapore. (n.d.). Dementia in numbers: Local and global statistics. DementiaHub.SG. Retrieved October 4, 2026, from https://www.dementiahub.sg/what-is-dementia/dementia-in-numbers-local-and-global-statistics/, Yeo Boon Khim Mind Science Centre. (n.d.). The rising number of dementia cases in Singapore and Asia. https://mindsciencecentre.nus.edu.sg/blog/the-rising-number-of-dementia-cases-in-singapore-and-asia/", "id": "J1", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Retrofit of exisiting HDB rental blocks", "desc": "In 2022, under the IDeAL@115 project initiated by Dementia Singapore and Kebun Baru Grassroots organisation, a HDB block consisting of one-room rental units was repurposed to provide assisted living services for seniors, particularly those with dementia.", "signif": "Potential low-cost retrofit pathway for repurposing Singapore's rental HDB stock into dementia/assisted-living use, rather than relying solely on new-build developments.", "why": "Tests whether community-led, ground-up models can deliver assisted living efficiently as dementia is on the rise.", "impact": "Medium impact - If replicated, could extend the usable life of Singapore's oldest rental blocks for eldercare use system-wide; if it fails to scale, highlights the limits of small VWO-led pilots without stronger institutional funding.", "status": "Small-scale pilot (single block), operational since 2022; no confirmed nationwide roll-out as of 2026.", "actors": "HDB, Dementia Singapore, Kebun Baru Grassroots Organisation, elderly rental-block tenants, Agency for Integrated Care", "domain": "CLC: High Quality of Life", "strength": "Emerging", "source": "Dementia Singapore. (2022, March 30). Dementia Singapore and Kebun Baru launch IDeAL@115 – a first-of-its-kind, assisted living model of care [Blog post]. https://dementia.org.sg/blog/2022/03/30/dementia-singapore-and-kebun-baru-launch-ideal115-a-first-of-its-kind-assisted-living-model-of-care/", "id": "J2", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Building of private assisted living homes", "desc": "In August 2026, Singapore launched its first fully equipped private assisted living development, targetted at the affluent elderly. Studio apartments are priced from about S$8,000 a month, which is more than two and a half times the estimated average monthly cost of long-term care in Singapore of about S$3,000.", "signif": "Signals private-sector entry into Singapore's assisted living market, which until now has been almost entirely publicly-led. Hence, introducing a two-tier (public/private) eldercare housing landscape.", "why": "Tests market appetite and a premium pricing model (from $8,000/month) for elderly/dementia housing. Its success will shape whether the private market plays a larger future role in Singapore's eldercare housing gap or stays niche.", "impact": "High impact - Could widen housing/care inequality between affluent and lower-income elderly if private options scale while public options lag behind.", "status": "Operational - Perennial Living opened August 2026 at 28 Parry Avenue, Kovan; Phase 2 nursing/memory care due 4Q2026. However, still remains as the only private assisted living home.", "actors": "Perennial Holdings (operator), URA, private eldercare sector", "domain": "Economic (STEEP)", "strength": "Black Elephant", "source": "Alavanza, M. (2026, August 20). Perennial Holdings unveils Perennial Living, private assisted living development for Singapore's ageing population. The Independent Singapore. https://theindependent.sg/perennial-holdings-unveils-perennial-living-private-assisted-living-development-for-singapore-s-ageing-population", "id": "J3", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Community care apartments", "desc": "HDB/MOH/MND joint scheme bundling purchased flats with 24hr monitoring.", "signif": "Represents the main current national model integrating housing with 24-hour care. Its expansion (lower eligibility age, reduced fees) signals this is being scaled up as a mainstream ageing-in-place option.", "why": "Community Care Apartments are HDB's flagship answer to 'ageing/dementia in place'; the scale-up trajectory (eligibility age cut from 65 to 55) indicates how much future demand government intends to meet through this model vs. private/institutional alternatives.", "impact": "Medium impact - 1)Wider eligibility could rapidly increase demand and waiting time 2) Continued success could justify further replication across more towns", "status": "National scale-up in progress; eligibility age lowered and fees cut from 2026.", "actors": "HDB, MND, MOH, community care apartment residents, care service operators", "domain": "CLC: High Quality of Life", "strength": "Emerging", "source": "Liew, I. (2026, July 13). Age eligibility for community care apartments to go down from 65 to 55, service fees lowered. The Straits Times. https://www.straitstimes.com/singapore/housing/age-eligibility-for-community-care-apartments-to-go-down-from-65-to-55-service-fees-lowered, Housing & Development Board. (n.d.). Community care apartments. Retrieved October 4, 2026, from https://www.hdb.gov.sg/buying-a-flat/bto-sbf-and-open-booking-of-flats/finding-a-new-flat/types-of-flats/community-care-apartments", "id": "J4", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Dementia villages", "desc": "Singapore's first purpose-built dementia care village was tendered by MOH/URA at Sembawang, featuring a cluster of state bungalows repurposed into a community-style residential model (not a traditional institutional facility) for persons with dementia. However, the tender turned out unsuccessful as the government deemed the bidded price to be too low.", "signif": "Potential residential model that enables seniors to age within a familiar, community-oriented environment while maintaining everyday routines and independence, rather than experiencing the isolation associated with institutional care. Could become another form of private assisted living for the wealthier elderly.", "why": "Tests a new care philosophy (autonomy/community vs. institutionalisation) which has been succesfully implemented in other countries such as Netherlands and France. However, it recieved mixed reactions from the public as some felt that dementia patients would be better off ageing at home. Furthermore, the inability of the private sector to meet the minimum bid price the government set highlights a lack of demand for a dementia village.", "impact": "High impact - If successful in the future, dementia villages could become a template for housing dementia patients in the future.", "status": "Government rejected only proposed bid of $15 million for tender as it was too low. No other dementia village plans in progress.", "actors": "MOH, URA, private housing developers", "domain": "CLC: High Quality of Life", "strength": "Weak", "source": "Yong, C. (2020, May 19). Sole bid for dementia village rejected as $15 million price offered was too low: MOH. The Straits Times. https://www.straitstimes.com/singapore/health/sole-bid-for-dementia-village-rejected-as-15-million-price-offered-was-too-low-moh, Pedro, C., Duarte, M., Jorge, B., & Freitas, D. (2020). Dementia villages: rethinking dementia care [Abstract 440]. International Psychogeriatrics, 32(S1), 158. https://doi.org/10.1017/S1041610220002926, Carpenter, D. (2025, November 5). The remarkable De Hogeweyk \"dementia village\" – A blueprint for living with end stage dementia. Dementia Alliance International. https://dementiaallianceinternational.org/blog/the-remarkable-de-hogeweyk-dementia-village-a-blueprint-for-living-with-end-stage-dementia, Hutchinson, S. (2023, December 23). Landais Alzheimer - the village where everyone has dementia. BBC News. https://www.bbc.com/news/health-67703848", "id": "J5", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Incorporation of dementia friendly facilities in HDBs", "desc": "Under HDB's expanded Silver Upgrading Programme (announced Aug 2024), 26 precincts nationwide are being upgraded with dementia friendly elements to help with navigation, therapeutic gardens, fitness trails, and handrails and ramps.", "signif": "Inclusion of dementia friendly elements into everyday HDB estates rather than confining such features to institutional facilities, highlights a shift toward universal, ageing-in-place.", "why": "Determines whether Singapore's response to rising dementia is primarily facility-based (new institutions) or environment-based (retrofitting where people already live).", "impact": "High impact - Broad retrofit across 26 precincts could benefit far more residents than small institutional pilots, but effectiveness depends on execution quality and residents'/caregivers' awareness of these features and how to use them.", "status": "Rolling out under HDB's expanded Silver Upgrading Programme", "actors": "HDB, AIC, CLC, NParks, BCA, LTA, URA, SUTD, elderly HDB residents", "domain": "CLC: Integrated Master Planning", "strength": "Emerging", "source": "Housing & Development Board. (2024, August 24). Silver Upgrading Programme to be rolled out in 26 precincts in Ang Mo Kio, Bukit Merah, Queenstown, and Toa Payoh to support ageing-in-place [News release]. https://www.hdb.gov.sg/hdb-pulse/news/2024/silver-upgrading-programme-to-be-rolled-out-in-26-precincts-to-support-ageing-in-place", "id": "J6", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Rising life expectancy", "desc": "Singapore resident life expectancy at birth rose to 83.9 years in 2025 (up from 82.9 years in 2015).", "signif": "Longer life expectancy lengthens the average time period during which dementia risk accumulates, directly increasing future housing demand.", "why": "Life expectancy is a key structural driver behind projected rise in dementia cases.", "impact": "High impact - Demand for assisted living will continue to rise in the future. Housing supply needs to meet this demand.", "status": "Ongoing trend; life expectancy at birth (83.9 years) and at age 65 (86.6 years) both reached record highs in 2025, surpassing pre-pandemic levels.", "actors": "SingStat, MOH, MOF (financing implications), elderly residents, families/caregivers", "domain": "Social (STEEP)", "strength": "Strong", "source": "Singapore Department of Statistics. (n.d.). Death and life expectancy: Latest news & data. Retrieved October 4, 2026, from https://www.singstat.gov.sg/find-data/explore-data-themes/population/death-and-life-expectancy/latest-news-data", "id": "J7", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Rising young-onset dementia", "desc": "NNI data shows young-onset cases of dementia (diagnosed before 65) is rising even as overall prevalence rate falls.", "signif": "Challenges the assumption that dementia-adapted housing is only needed for retirees. A rising share of new cases affects people still of working age with young families, possibly implying different housing needs.", "why": "If housing policy for dementia focuses solely on retiree-oriented models, it may fail to serve younger patients who need to remain economically active and centrally located, posing a distinct planning challenge.", "impact": "High impact - Could require a new housing/support sub-model integrating caregiving flexibility with continued employment, rather than the retirement-community models being built for the older cohort.", "status": "Young-onset cases rose from 60 (2013) to about 90 new cases (2023), even as Singapore's overall age-standardised dementia prevalence rate has been falling.", "actors": "National Neuroscience Institute (NNI, Dementia Singapore, IMH, working-age adults diagnosed with YOD, employers, families with young children", "domain": "Social (STEEP)", "strength": "Black Jellyfish", "source": "Chin, S. F. (2023, May 20). Young onset dementia: Growing group faces financial, social challenges. The Straits Times. https://www.straitstimes.com/singapore/young-onset-dementia-growing-group-faces-financial-social-challenges,", "id": "J8", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Inter-Generational Co-living schemes", "desc": "Existing HDB schemes (Multi-Generation Priority Scheme, Proximity Housing Grant) promote multi-generational proximity and co-living which could ease informal caregiving for elderly relatives with dementia.", "signif": "Represents a potential 'soft infrastructure' alternative to institutional dementia housing, keeping elderly residents embedded within multi-generational family networks rather than segregated facilities.", "why": "If informal family caregiving is to remain viable, the government needs to continue to encourage children to live in close proximity to their parents by issuing grants.", "impact": "Medium impact - Could reduce demand for institutional/assisted-living dementia housing if adopted but depends whether younger generations are willing to co-reside or look after their parents.", "status": "Multi-Generation Priority Scheme and Proximity Housing Grant are currently existing schemes.", "actors": "HDB, MND, multi-generational families, urban planners", "domain": "CLC: Integrated Master Planning", "strength": "Strong", "source": "Housing & Development Board. (2025, July 19). New Family Care Scheme (Proximity) better supports parents and children to live closer together [News release]. https://www.hdb.gov.sg/hdb-pulse/news/2025/new-fcs-proximity-better-supports-parents-and-children-to-live-closer-together", "id": "J9", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "SINEW project (SMU × Sengkang General Hospital)", "desc": "AI + ambient home sensors detecting Mild Cognitive Impairment before it progresses to dementia; 200+ seniors recruited since 2020. Serves as a potential research-stage signal for future \"diagnostic housing.\"", "signif": "Points to a future where 'diagnostic housing' could enable much earlier detection of cognitive decline than current clinical pathways, shifting dementia care further upstream (prevention/early intervention) in a non-intrusive way.", "why": "Early MCI detection could delay or prevent progression to full dementia for some residents (up to 45% of cases have modifiable risk factors per the 2024 Lancet Commission), potentially reducing future demand for dementia-specific housing if scaled successfully.", "impact": "Medium impact - If commercialised, ambient sensor technology could be integrated into HDB assisted living units by 2040 as a standard feature, shifting the housing conversation from 'where dementia patients live' to 'how homes actively monitor and delay dementia onset.'", "status": "Ongoing; 200+ seniors recruited since 2020.", "actors": "SMU, Sengkang General Hospital, SingHealth Duke-NUS, seniors living alone, caregivers", "domain": "Technological (STEEP)", "strength": "Weak", "source": "SMU Corporate Communications team. (2025, July 7). SMU and Sengkang General Hospital partner to support ageing-in-place for elders living alone. SMU Newsroom. https://news.smu.edu.sg/news/2025/07/07/smu-and-sengkang-general-hospital-partner-support-ageing-place-elders-living-1, Kandinah, N. (2026). Mild cognitive impairment diagnosis and care algorithms and the role of digital interventions: Expert consensus. CNS Neuroscience & Therapeutics, 32(9), Article e71085. https://doi.org/10.1002/cns.71085", "id": "J10", "owner": "Jathu", "log": "Dementia & housing 2040"}, {"title": "Vertical kampung", "desc": "HDB's 'vertical kampung' model co-locates senior housing with childcare, healthcare, and community facilities within a single high-rise development.", "signif": "Offers a scalable, integrated prototype for embedding dementia-friendly design, on-site healthcare, and intergenerational contact directly into mainstream HDB senior housing, rather than relying solely on standalone institutional facilities.", "why": "Tests whether a single-integrated building can meet rising demand for dementia-friendly, ageing-in-place housing more efficiently than institutional or retrofit-only approaches.", "impact": "Medium impact - If successfully replicated across more towns, it could become HDB's default template for dementia housing by 2040; if it stays a one-off due to cost and lack of demand, Singapore may have to rely more on other housing models.", "status": "Operational prototype since 2018 (Kampung Admiralty)", "actors": "HDB, MND, MOH, NTUC Health, WOHA (architect), elderly residents, young families, childcare/polyclinic/dialysis operators", "domain": "CLC: Integrated Master Planning", "strength": "Emerging", "source": "Yap, C. B. (2019, April). Kampung Admiralty: Building for all ages. ETHOS, (Digital Issue 04). https://knowledge.csc.gov.sg/digital-issue-04/kampung-admiralty-building-for-all-ages/", "id": "J11", "owner": "Jathu", "log": "Dementia & housing 2040"}];

const STRENGTH_VOL = {Weak:3, Emerging:2, Strong:1};
function strengthOf(s){ s=(s||"").toLowerCase();
  if(/strong|happening|now|enacted|moderate/.test(s)) return s.includes("moderate")?"Emerging":"Strong";

function norm15(vals){ const mn=Math.min(...vals), mx=Math.max(...vals);
  return vals.map(v=> mx===mn ? 3 : 1+4*((v-mn)/(mx-mn))); }
function wheelNodes(w){ const out=[]; (w||[]).forEach((f,i)=>{ out.push({lvl:1,t:f.t,tags:f.tags||[],key:"f"+i});
  (f.second||[]).forEach((s,j)=>out.push({lvl:2,t:s.t,tags:s.tags||[],key:"f"+i+"s"+j})); }); return out; }
// Futures-wheel method
function wheelScores(drivers){ // drivers: [{id, wheel:[{t,tags,second:[{t,tags}]}]}]
  const nodes = drivers.map(d=>wheelNodes(d.wheel));
  const tagSets = nodes.map(ns=>{ const s=new Set(); ns.forEach(n=>n.tags.forEach(t=>s.add(t))); return s; });
  const uRaw = nodes.map(ns=> new Set(ns.filter(n=>n.lvl===2).map(n=>n.t.trim().toLowerCase())).size );
  const overlaps = nodes.map((ns,i)=> ns.map(n=>{
      const hits=[]; drivers.forEach((d,j)=>{ if(j!==i && n.tags.some(t=>tagSets[j].has(t))) hits.push(d.id); });
      return {node:n, hits}; }));
  const iRaw = overlaps.map(o=>o.reduce((a,x)=>a+x.hits.length,0));
  const U=norm15(uRaw), I=norm15(iRaw);
  return drivers.map((d,k)=>({id:d.id, uRaw:uRaw[k], iRaw:iRaw[k], U:U[k], I:I[k], overlaps:overlaps[k]}));
}
// Johnson's algorithm for elementary cycles
function findCycles(nodeIds, edges, cap=2000){
  const idx=new Map(nodeIds.map((n,i)=>[n,i])); const N=nodeIds.length;
  const adj=Array.from({length:N},()=>[]); edges.forEach(e=>{ if(idx.has(e.from)&&idx.has(e.to)) adj[idx.get(e.from)].push(idx.get(e.to)); });
  const cycles=[];
  for(let s=0;s<N && cycles.length<cap;s++){
    const blocked=new Array(N).fill(false), B=Array.from({length:N},()=>new Set()), stack=[];
    const unblock=u=>{ blocked[u]=false; for(const w of [...B[u]]){ B[u].delete(w); if(blocked[w]) unblock(w);} };
    const circuit=v=>{ let f=false; stack.push(v); blocked[v]=true;
      for(const w of adj[v]){ if(w<s) continue;
        if(w===s){ cycles.push(stack.map(i=>nodeIds[i])); f=true; if(cycles.length>=cap) break; }
        else if(!blocked[w]){ if(circuit(w)) f=true; } }
      if(f) unblock(v); else for(const w of adj[v]){ if(w>=s) B[w].add(v); }
      stack.pop(); return f; };
    circuit(s);
  }
  return cycles;
}
function classifyLoops(cycles, edges){
  const sign=new Map(edges.map(e=>[e.from+">"+e.to,e.sign]));
  return cycles.map((c,i)=>{ let neg=0; const links=[];
    for(let k=0;k<c.length;k++){ const a=c[k], b=c[(k+1)%c.length]; const s=sign.get(a+">"+b); if(s<0) neg++; links.push({from:a,to:b,sign:s}); }
    return {nodes:c, links, type: neg%2===0?"R":"B", neg}; });
}
function systemScores(nodeIds, edges, loops, vol, alpha, beta, gamma){
  const out={}, inn={}, inLoops={};
  nodeIds.forEach(n=>{out[n]=0;inn[n]=0;inLoops[n]=0;});
  edges.forEach(e=>{ if(e.from in out) out[e.from]++; if(e.to in inn) inn[e.to]++; });
  loops.forEach(l=>l.nodes.forEach(n=>{ if(n in inLoops) inLoops[n]++; }));
  const Iraw=nodeIds.map(n=>inLoops[n]+alpha*out[n]);
  const Uraw=nodeIds.map(n=>beta*inn[n]+gamma*(vol[n]??2));
  const I=norm15(Iraw), U=norm15(Uraw);
  return nodeIds.map((n,k)=>({id:n, loops:inLoops[n], out:out[n], inn:inn[n], vol:vol[n]??2, iRaw:Iraw[k], uRaw:Uraw[k], I:I[k], U:U[k]}));
}

  const sysMap = new Map(sysD.map((s,k)=>[s.id,{...s, loopI:In[k], I:impact.get(s.id).score, U:Un[k]}]));
  const sysAllMap = new Map(sysAll.map(s=>[s.id,s]));
  // group votes
  const voteAgg = new Map(); let voters=0;
  Object.values(S.votes).forEach(v=>{ const sc=v.scores||{}; if(Object.keys(sc).length) voters++;
    Object.entries(sc).forEach(([id,r])=>{ if(!byId.has(id)) return; const a=voteAgg.get(id)||{i:0,u:0,n:0};
      if(r.i&&r.u){ a.i+=+r.i; a.u+=+r.u; a.n++; } voteAgg.set(id,a); }); });
  const vote = new Map([...voteAgg].filter(([,a])=>a.n).map(([id,a])=>[id,{I:a.i/a.n,U:a.u/a.n,n:a.n}]));
  const shortIds = drivers.filter(d=>S.shortlist[d.id]).map(d=>d.id);
  CACHE = {v:VER,a:UI.alpha,b:UI.beta,g:UI.gamma, drivers, byId, ws:wsMap, nodeIds, edges, loops, sys:sysMap, sysAll:sysAllMap, vol, vote, voters, shortIds, impact};
  return CACHE;
}

function wrapText(t, max){ const words=String(t).split(/\s+/); const lines=[]; let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur) lines.push(cur);
  if(lines.length>4){ lines.length=4; lines[3]=lines[3].replace(/.{0,2}$/,"…"); } return lines; }
function svgLabel(x,y,lines,size,weight,fill){ const lh=size*1.2; const y0=y-(lines.length-1)*lh/2;
  return `<text x="${x}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" font-weight="${weight}" fill="${fill}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join("")}</text>`; }
function wheelSVG(d, wheel){
  const W=780, C=W/2, r1=175, r2=318; const n=wheel.length||1; let s="";
  const pos1=wheel.map((f,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return {a,x:C+r1*Math.cos(a),y:C+r1*Math.sin(a)}; });
  // second-order positions
  const pos2=wheel.map((f,i)=>{ const k=(f.second||[]).length; const spread=Math.min(2*Math.PI/n*0.62, 1.15);
    return (f.second||[]).map((x,j)=>{ const a=pos1[i].a+(k>1? -spread/2+j*spread/(k-1):0); return {a,x:C+r2*Math.cos(a),y:C+r2*Math.sin(a)}; }); });
  // rings
  s+=`<circle cx="${C}" cy="${C}" r="${r1}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/><circle cx="${C}" cy="${C}" r="${r2}" fill="none" stroke="var(--line)" stroke-dasharray="3 5"/>`;
  wheel.forEach((f,i)=>{ s+=`<line x1="${C}" y1="${C}" x2="${pos1[i].x}" y2="${pos1[i].y}" stroke="var(--accent)" stroke-width="2"/>`;
    pos2[i].forEach(p=>{ s+=`<line x1="${pos1[i].x}" y1="${pos1[i].y}" x2="${p.x}" y2="${p.y}" stroke="var(--muted)" stroke-width="1.2"/>`; }); });
  wheel.forEach((f,i)=>{ pos2[i].forEach((p,j)=>{ const t=f.second[j]; const L=wrapText(t.t,20); const h=16+L.length*14;
      s+=`<g><title>${esc(t.t)} · ${esc((t.tags||[]).map(x=>TAGS[x]||x).join(", "))}</title><rect x="${p.x-78}" y="${p.y-h/2}" width="156" height="${h}" rx="8" fill="var(--surface)" stroke="var(--line)"/>${svgLabel(p.x,p.y,L,12,400,"var(--ink)")}</g>`; }); });
  wheel.forEach((f,i)=>{ const p=pos1[i]; const L=wrapText(f.t,19); const h=20+L.length*15;
    s+=`<g><title>${esc(f.t)}</title><rect x="${p.x-82}" y="${p.y-h/2}" width="164" height="${h}" rx="10" fill="var(--accent-soft)" stroke="var(--accent)"/>${svgLabel(p.x,p.y,L,13,700,"var(--ink)")}</g>`; });
  const L=wrapText(d.title,16); s+=`<circle cx="${C}" cy="${C}" r="72" fill="var(--accent)"/>${svgLabel(C,C,L,15,700,"var(--accent-ink)")}`;
  s+=`<text x="${C+r1+6}" y="${C-6}" font-size="10" fill="var(--muted)">1st order</text><text x="${C+r2-30}" y="${C-r2*0+18}" font-size="10" fill="var(--muted)">2nd order</text>`;
  return `<svg class="wheel-svg" viewBox="0 0 ${W} ${W}" role="img" aria-label="Futures wheel for ${esc(d.title)}">${s}</svg>`;
}

const POS = {}; let POS_KEY="";
function layoutCLD(nodeIds, edges){
  const key=nodeIds.join()+"|"+edges.length; if(key===POS_KEY) return; POS_KEY=key;
  const W=1180,H=980,cx=W/2,cy=H/2; const aux=nodeIds.filter(n=>AUXMAP.has(n)), drv=nodeIds.filter(n=>!AUXMAP.has(n));
  const p={}; aux.forEach((n,i)=>{ const a=i/aux.length*2*Math.PI; const r=n==="A_ROOT"?0:150; p[n]=POS[n]||{x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}; });

  const ang=n=>{ const e=edges.find(e=>(e.from===n&&AUXMAP.has(e.to))||(e.to===n&&AUXMAP.has(e.from))); if(!e) return 9; const o=e.from===n?e.to:e.from; return Math.atan2(p[o].y-cy,p[o].x-cx); };

  const ix=new Map(nodes.map((n,i)=>[n.id,i]));
  for(let it=0;it<260;it++){ const t=1-it/260;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){ const a=nodes[i],b=nodes[j]; let dx=a.x-b.x,dy=a.y-b.y; let d2=dx*dx+dy*dy||1; if(d2>90000) continue; const f=5200/d2*t; const d=Math.sqrt(d2); dx/=d;dy/=d; if(!a.fixed){a.x+=dx*f;a.y+=dy*f;} if(!b.fixed){b.x-=dx*f;b.y-=dy*f;} }
    edges.forEach(e=>{ const a=nodes[ix.get(e.from)],b=nodes[ix.get(e.to)]; if(!a||!b) return; const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1; const f=(d-170)*0.02*t; if(!a.fixed){a.x+=dx/d*f;a.y+=dy/d*f;} if(!b.fixed){b.x-=dx/d*f;b.y-=dy/d*f;} });
    nodes.forEach(n=>{ if(n.fixed) return; n.x+= (cx-n.x)*0.004*t; n.y+=(cy-n.y)*0.004*t; n.x=Math.max(80,Math.min(W-80,n.x)); n.y=Math.max(40,Math.min(H-40,n.y)); });

}

     <rect x="${p.x-bx.w/2}" y="${p.y-bx.h/2}" width="${bx.w}" height="${bx.h}" rx="${aux?bx.h/2:6}" fill="${fill}" stroke="${sh?"var(--accent)":"var(--line)"}" stroke-width="${sh?2.5:1}" ${aux&&!aux.focal?'stroke-dasharray="4 3"':""}/>

}

const COLMAP = {"Item / Signal":"title","Description":"desc","Significance for Future":"signif","Why Important?":"why","Consequences or Impacts":"impact","Current Status":"status","Classification / Domain":"domain","Signal Strength":"strength","Source":"source","Scanner Name":"scanner"};
function domainOf(s){ s=String(s||""); for(const k of ["Social","Technological","Economic","Environmental","Political","Legislative"]) if(s.toLowerCase().includes(k.toLowerCase())) return k; if(/legal|policy/i.test(s)) return "Political"; if(/green plan/i.test(s)) return "Environmental"; if(/CLC/i.test(s)) return "Planning"; return "Other"; }
async function parseUpload(file){
  if(!window.XLSX){ toast("The spreadsheet reader is still loading. Try again in a moment."); return; }
  const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:"array"});
  const name=wb.SheetNames.find(n=>/scanning/i.test(n))||wb.SheetNames[0]; const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:""});
  const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==="Item / Signal"));
  if(hi<0){ UI.upload={file:file.name, error:"Couldn't find a header row with “Item / Signal”. Use the PPPM301 scanning log template."}; render(); return; }
  const hdr=rows[hi].map(c=>String(c).trim()); const out=[];
  rows.slice(hi+1).forEach(r=>{ const o={}; Object.entries(COLMAP).forEach(([c,k])=>{ const i=hdr.indexOf(c); o[k]=i>=0?String(r[i]??"").trim():""; }); if(o.title) out.push(o); });
  UI.upload={file:file.name, sheet:name, rows:out, pick:out.map(()=>false)}; render();
}

      wheel:d.wheel, impactOnRootedness:m.impact.get(d.id), scores:{wheel:m.ws.get(d.id)&&{importance:+m.ws.get(d.id).I.toFixed(2),uncertainty:+m.ws.get(d.id).U.toFixed(2)}, system:m.sys.get(d.id)&&{importance:+m.sys.get(d.id).I.toFixed(2),uncertainty:+m.sys.get(d.id).U.toFixed(2),loops:m.sys.get(d.id).loops}, vote:m.vote.get(d.id)||null},
      mnd:linkOf(d), notes:notesFor(d.id).map(([,n])=>({text:n.text,at:n.at}))})),
    auxiliary:AUX, links:m.edges.map(e=>({from:e.from,to:e.to,polarity:e.sign<0?"-":"+",why:e.note,signals:e.signals,assumed:e.assumed})),
    loops:m.loops.map(l=>({name:l.name,type:l.type,nodes:l.nodes,story:LOOP_STORY[l.key]||null})), scenarios:Object.values(S.scenarios)},null,2); }
  else if(kind==="mermaid"){ const nid=id=>id.replace(/[^A-Za-z0-9_]/g,"_"); const lab=s=>s.replace(/"/g,"'");
    txt="graph LR\n"+m.nodeIds.map(id=>`  ${nid(id)}${AUXMAP.has(id)?`(["${lab(nodeTitle(id))}"])`:`["${lab(nodeTitle(id))}"]`}`).join("\n")+"\n"+m.edges.map(e=>`  ${nid(e.from)} ${e.assumed?"-.->":"-->"}|${e.sign<0?"−":"+"}| ${nid(e.to)}`).join("\n"); }
  else { const q=s=>`"${String(s??"").replace(/"/g,'""')}"`; const rows=[["ID","Driver","Owner","Domain","Signal strength","Shortlisted","Vote impact","Vote uncertainty","Impact on rootedness","Impact reason","Wheel uncertainty","System uncertainty","Links to problem","Why MND cares","Notes"]];
    m.drivers.forEach(d=>{ const v=m.vote.get(d.id), w=m.ws.get(d.id), s=m.sys.get(d.id), l=linkOf(d);
      rows.push([d.id,d.title,d.owner,d.domain,d.strength,S.shortlist[d.id]?"Yes":"",v?v.I.toFixed(2):"",v?v.U.toFixed(2):"",m.impact.get(d.id).score,m.impact.get(d.id).why,w?w.U.toFixed(2):"",s?s.U.toFixed(2):"",l.link,l.why,notesFor(d.id).map(([,n])=>n.text).join(" | ")]); });
    txt=rows.map(r=>r.map(q).join(",")).join("\n"); }
  UI.exportText=txt; UI.exportKind=kind; render();
}
VIEWS.data = () => {

// ================= Events =================
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,a,[data-loop],.mdot,.cnode"); if(!t) return; const ds=t.dataset;
  if(ds.tab){ go(ds.tab); return; }
  if(ds.go){ e.preventDefault(); go(ds.go); return; }
  if(ds.short){ const id=ds.short; const m=model();
    if(S.shortlist[id]) await del("shortlist",id);
    else if(m.shortIds.length>=MAX_SHORT) toast(`The shortlist is full (${MAX_SHORT}). Remove one first.`);
    else await put("shortlist",id,{on:true}); return; }
  if(ds.addnote){ const id=ds.addnote; const ta=$("#note-"+id); const text=(ta?.value||"").trim(); if(!text){ toast("Write something first."); return; }
    UI.pending["open-"+id]=true; if(await put("notes",uid("n"),{driverId:id,text,sig:ME.sig||""})){ ta.value=""; delete ta.dataset.dirty; } return; }
  if(ds.delnote){ await del("notes",ds.delnote); return; }
  if(ds.wheel){ go("wheels",{wheelId:ds.wheel, editWheel:false}); UI.pending.editBuf=null; return; }
  if(ds.jump){ go("drivers",{q:"",owner:"",domain:"",onlyShort:false}); setTimeout(()=>{ const c=$("#card-"+ds.jump); c&&c.scrollIntoView({block:"start"}); },50); return; }
  if(ds.wedit){ UI.editWheel=true; UI.pending.editBuf=null; render(); return; }
  if(ds.wcancel){ UI.editWheel=false; UI.pending.editBuf=null; render(); return; }
  if(ds.wadd1){ const b=readEditor(UI.pending.editBuf); b.push({t:"New consequence",tags:["local-ties"],second:[]}); UI.pending.editBuf=b; clearDirty(); render(); return; }
  if(ds.wadd2){ const b=readEditor(UI.pending.editBuf); b[+ds.wadd2].second.push({t:"New ripple effect",tags:["local-ties"]}); UI.pending.editBuf=b; clearDirty(); render(); return; }
  if(ds.wrm){ const b=readEditor(UI.pending.editBuf); const [i,j]=ds.wrm.split("-").map(Number); if(j==null||isNaN(j)) b.splice(i,1); else b[i].second.splice(j,1); UI.pending.editBuf=b; clearDirty(); render(); return; }
  if(ds.wsave){ const w=readEditor(UI.pending.editBuf).filter(f=>f.t); if(await put("wheels",ds.wsave,{wheel:w})){ UI.editWheel=false; UI.pending.editBuf=null; clearDirty(); toast("Wheel saved. Scores updated for everyone."); } return; }
  if(ds.wreset){ await del("wheels",ds.wreset); toast("Original wheel restored."); return; }
  if(ds.refine){ refineWheel(ds.refine); return; }
  if(ds.wkeep){ const d=UI.pending.wheelDraft; if(d && await put("wheels",ds.wkeep,{wheel:d.wheel})){ UI.pending.wheelDraft=null; UI.pending.refineText=""; toast("Wheel saved. Scores updated for everyone."); render(); } return; }
  if(ds.wdrop){ UI.pending.wheelDraft=null; render(); return; }
  if(t.classList.contains("mdot")||ds.sel){ UI.sel=t.dataset.sel; render(); return; }
  if(ds.method){ UI.method=ds.method; render(); return; }
  if(ds.voteall){ UI.voteAll=!UI.voteAll; render(); return; }
  if(ds.linksall){ UI.linksAll=!UI.linksAll; render(); return; }
  if("ltype" in ds){ UI.loopType=ds.ltype; UI.loopSel=null; render(); return; }
  if("loop" in ds && !t.classList.contains("cnode")){ UI.loopSel = ds.loop && UI.loopSel!==ds.loop ? ds.loop : null; render(); if(UI.loopSel) $("#cld")?.parentElement.scrollIntoView({block:"start",behavior:"smooth"}); return; }
  if(ds.addedge){ const from=$("#e-from").value,to=$("#e-to").value,sign=+$("#e-sign").value,note=$("#e-note").value.trim();
    if(from===to){ toast("Pick two different boxes."); return; } if(!note){ toast("Add a reason or source for the link."); return; }
    if(await put("edges",uid("e"),{from,to,sign,note})){ toast("Link added. Loops recalculated."); } return; }
  if(ds.deledge){ await del("edges",ds.deledge); return; }
  if(ds.savelink){ const id=ds.savelink; if(await put("links",id,{link:$("#lk-"+id).value,why:$("#wy-"+id).value})){ ["lk-","wy-"].forEach(p=>{const el=$("#"+p+id); if(el) delete el.dataset.dirty;}); toast("Saved."); } return; }
  if(ds.newboard){ const id=uid("b"); if(await put("scenarios",id,blankBoard())){ UI.board=id; UI.pending.boardBuf=null; } return; }
  if(ds.dupboard){ const b=bufBoard(); const id=uid("b"); if(await put("scenarios",id,{...b,title:b.title+" (copy)",created:Date.now()})){ UI.board=id; UI.pending.boardBuf=null; clearDirty(); } return; }
  if(ds.delboard){ if(UI.pending.confirmDel!==ds.delboard){ UI.pending.confirmDel=ds.delboard; toast("Tap Delete again to remove this board for everyone."); return; } UI.pending.confirmDel=null; await del("scenarios",ds.delboard); UI.board=null; UI.pending.boardBuf=null; return; }
  if(ds.saveboard){ const b=bufBoard(); if(await put("scenarios",ds.saveboard,b)){ UI.pending.boardBuf=null; clearDirty(); toast("Board saved for the group."); } return; }
  if(ds.draftboard){ draftBoard(ds.draftboard); return; }
  if(ds.qrm){ const [k,id]=ds.qrm.split("|"); const b=bufBoard(); b.q[k].drivers=(b.q[k].drivers||[]).filter(x=>x!==id); render(); return; }
  if(ds.promote){ const s=SIG.get(ds.promote); const id=uid("C"); if(await put("drivers",id,{title:s.title.replace(/^\[[^\]]+\]\s*/,"").slice(0,80), owner:s.owner, domain:domainOf(s.domain), strength:strengthOf(s.strength), one:(s.desc||s.impact||"").slice(0,220), evidence:s.desc||"", signals:[s.id], wheel:[]})){ toast("Added as a driver. Draft its futures wheel next."); go("wheels",{wheelId:id}); } return; }
  if(ds.deldriver){ await del("drivers",ds.deldriver); await del("shortlist",ds.deldriver); return; }
  if(ds.upadd){ const u=UI.upload; const owner=$("#up-owner").value; let n=0;
    for(let i=0;i<u.rows.length;i++){ if(!u.pick[i]) continue; const r=u.rows[i];
      if(await put("drivers",uid("C"),{title:r.title.slice(0,80), owner:r.scanner||owner, domain:domainOf(r.domain), strength:strengthOf(r.strength), one:(r.desc||r.impact).slice(0,220), evidence:[r.desc,r.impact].filter(Boolean).join(" Consequences: "), source:r.source, wheel:[]})) n++; }
    toast(`${n} driver${n===1?"":"s"} added.`); UI.upload=null; render(); return; }
  if(ds.saveimp){ const id=ds.saveimp; const score=+$("#imp-s-"+id).value, why=$("#imp-w-"+id).value.trim(); if(!why){ toast("Add a reason for the score."); return; }
    if(await put("impact",id,{score,why})){ const el=$("#imp-w-"+id); if(el) delete el.dataset.dirty; toast("Impact score saved. Matrix updated for everyone."); } return; }
  if(ds.resetimp){ await del("impact",ds.resetimp); toast("Claude's draft score restored."); return; }
  if(ds.export){ exportData(ds.export); return; }
  if(ds.copy){ const txt=UI.exportText; try{ await navigator.clipboard.writeText(txt); toast("Copied."); }catch(err){ const ta=$("#exp-out"); ta.focus(); ta.select(); toast("Press Ctrl/Cmd+C to copy."); } return; }
  if(ds.dl){ const ext={csv:"csv",json:"json",mermaid:"mmd"}[UI.exportKind]; const type={csv:"text/csv",json:"application/json",mermaid:"text/plain"}[UI.exportKind];
    try{ await downloads.save({filename:`youth-rootedness-2040.${ext}`, data:new Blob([UI.exportText],{type})}); }catch(err){ toast("Download didn't go through. Use Copy instead."); } return; }
  if(ds.savesig){ ME.sig=$("#my-sig").value.trim(); try{localStorage.setItem("ry-sig",ME.sig);}catch(err){} toast("Name saved on this browser."); return; }
});
function clearDirty(){ document.querySelectorAll("#main [data-dirty]").forEach(el=>delete el.dataset.dirty); }
document.addEventListener("keydown", e=>{ const t=e.target; if((e.key==="Enter"||e.key===" ") && t.matches && t.matches(".loop[data-loop]")){ e.preventDefault(); t.click(); } });
document.addEventListener("input", e=>{ const t=e.target;
  if(t.matches("textarea,input[type=text]")) t.dataset.dirty="1";
  if(t.id==="f-q"){ UI.q=t.value; delete t.dataset.dirty; scheduleRender(); }
  if(t.id==="s-q"){ UI.sigQ=t.value; delete t.dataset.dirty; scheduleRender(); }
  if(t.id==="refine") UI.pending.refineText=t.value;
  if(t.dataset.weight){ UI[t.dataset.weight]=+t.value; scheduleRender(); }
});
document.addEventListener("change", async e=>{ const t=e.target;
  if(t.id==="f-owner"){ UI.owner=t.value; render(); }
  if(t.id==="f-domain"){ UI.domain=t.value; render(); }
  if(t.id==="s-owner"){ UI.sigOwner=t.value; render(); }
  if(t.id==="s-used"){ UI.sigUsed=t.value; render(); }
  if(t.id==="board-pick"){ UI.board=t.value; UI.pending.boardBuf=null; clearDirty(); render(); }
  if(t.dataset.desir || ["x-driver","y-driver"].includes(t.id)){ const b=bufBoard();
    if(t.id==="x-driver"||t.id==="y-driver"){ const a=t.id[0]; const d=model().byId.get(t.value); if(d && !b[a].label) b[a].label=d.title; }
    render(); }
  if(t.dataset.qadd && t.value){ const b=bufBoard(); const k=t.dataset.qadd; b.q[k].drivers=[...(b.q[k].drivers||[]),t.value]; render(); }
  if(t.dataset.vote){ const id=t.dataset.vote, k=t.dataset.k; const key=ME.id||"local"; const cur=JSON.parse(JSON.stringify(S.votes[key]?.scores||{}));
    cur[id]={...(cur[id]||{}),[k]:t.value?+t.value:null}; await put("votes",key,{scores:cur}); }
  if(t.dataset.uppick){ UI.upload.pick[+t.dataset.uppick]=t.checked; }
  if(t.id==="upl" && t.files[0]) parseUpload(t.files[0]);
});
document.addEventListener("toggle", e=>{ const t=e.target; if(t.dataset && t.dataset.keep) UI.pending[t.dataset.keep]=t.open; }, true);
// scenario board edits typed into fields mark the board as unsaved
document.addEventListener("focusout", e=>{ const t=e.target; if(UI.tab==="scenarios" && t.closest && t.closest("#main") && /^(b-title|x-|y-|q-)/.test(t.id||"")){ bufBoard(); const st=$("#board-status"); if(st) st.textContent="Unsaved changes"; } });

// ================= Init =================
async function init(){
  renderTabs(); render(); setStatus();
  const C=window.claude; if(!C||!C.use){ MODE="local"; setStatus(); render(); return; }
  const [d,u,sm,dl]=await Promise.all([C.use("db"),C.use("user"),C.use("sample"),C.use("downloads")]);
  db=d; user=u; sample=sm; downloads=dl;
  if(user){ try{ ME={...ME, ...(await user.me())}; ME.id = await user.id(); }catch(e){} try{ const c=await user.can("data.write"); if(c===false) CANWRITE=false; }catch(e){} }
  if(!db){ MODE="local"; setStatus(); render(); return; }
  MODE="shared"; setStatus();
  COLS.forEach(col=>{ db.collection(col).onSnapshot(snap=>{ const o={}; snap.docs.forEach(doc=>{ o[doc.id]=doc.data(); }); S[col]=o; changed();
      if(col==="notes"||col==="scenarios") names(Object.values(o).map(x=>x.by)); },
    err=>{ if(err&&err.code==="revoked"){ MODE="local"; setStatus(); } }); });
  render();
}
init();
