<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workspaces & Analytical Dashboards Portfolios</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --tag-bg: #eff6ff;
      --tag-text: #1e40af;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 4rem 0 3.5rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.85rem, 3.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    header p {
      font-size: 1.1rem;
      color: #cbd5e1;
      max-width: 650px;
    }

    /* Main Section */
    main {
      padding: 3rem 0 5rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .section-header h2 {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .project-count {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
    }

    /* Portfolio Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.75rem;
    }

    /* Project Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tag {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      line-height: 1.35;
    }

    .card p.description {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
    }

    .team-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      margin-bottom: 0.35rem;
    }

    .team-list {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .team-list strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.7rem 1.25rem;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 0.925rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      transition: transform 0.15s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 0;
      text-align: center;
      font-size: 0.875rem;
      color: var(--text-light);
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1>Workspaces &amp; Analytical Dashboards Portfolios</h1>
      <p>Sustainability Science, Systems Thinking, and Futures Thinking</p>
    </div>
  </header>

  <main class="container">
    <div class="section-header">
      <h2>Active Portfolios</h2>
      <span class="project-count" id="project-count">0 Workspaces</span>
    </div>

    <!-- Cards are automatically generated here from the list below -->
    <div class="grid" id="portfolio-grid"></div>
  </main>

  <footer>
    <div class="container">
      &copy; 2026 Jude Kurniawan, PhD. All rights reserved.
    </div>
  </footer>

  <script>
    // =========================================================================
    // HOW TO ADD A NEW PROJECT:
    // Copy one { ... } block below, paste it into the list, and update the text.
    // =========================================================================
    const projects = [
      {
        filename: "youth-rootedness-2040.html", // <-- Update to match your exact filename
        title: "Youth Rootedness 2040",
        description: "Foresight workspace designed for analyzing macro driving forces through qualitative systems mapping, dynamic feedback loops, futures wheel, and scenario evaluation.",
        tags: ["PPPM301", "Foresight"],
        leadDev: "Leong Yan Lyn",
        teamMembers: "Wong Jia-en Grace, Gowri Shankar Jathukullan, Teh Shu Ting Hannah, Taheer Faiyaaz Basrai"
      },
      {
        filename: "signal-pairings.html",
        title: "Collaborative Signal Pairings and Cross-impact Workbench",
        description: "Multi-user intake workspace for aggregating driving forces and audit AI-drafted cross-impact ratings.",
        tags: ["PPPM301", "Foresight"],
        leadDev: "Megan Tham",
        teamMembers: "Chew Yu Hui, Lee Kwan Jun Brandon, Tan Ai Lin, Tanvi Satti"
      },
      {
        filename: "PPPM301_analysis_overview.html",
        title: "HDB Beyond 2045: Foresight and Policy Analysis",
        description: "Collaborative workspace for horizon scanning, scenario matrix, and systems mapping workbench.",
        tags: ["PPPM301", "Foresight"],
        leadDev: "Megan Tham",
        teamMembers: "Chew Yu Hui, Lee Kwan Jun Brandon, Tan Ai Lin, Tanvi Satti"
      }
    ];

    // =========================================================================
    // RENDER LOGIC (No need to edit below this line)
    // =========================================================================
    const grid = document.getElementById("portfolio-grid");
    const countBadge = document.getElementById("project-count");

    countBadge.textContent = `${projects.length} Workspace${projects.length === 1 ? "" : "s"}`;

    projects.forEach((project) => {
      const tagsHTML = project.tags
        .map((tag) => `<span class="tag">${tag}</span>`)
        .join("");

      const teamHTML = project.leadDev
        ? `<strong>${project.leadDev}</strong> (Lead Dev)${project.teamMembers ? ", " + project.teamMembers : ""}`
        : project.teamMembers;

      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div>
          <div class="tags">${tagsHTML}</div>
          <h3>${project.title}</h3>
          <p class="description">${project.description}</p>
        </div>
        <div class="card-footer">
          <div class="team-label">Project Team</div>
          <div class="team-list">${teamHTML}</div>
          <a href="${project.filename}" class="btn">
            Open Workspace
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
            </svg>
          </a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
